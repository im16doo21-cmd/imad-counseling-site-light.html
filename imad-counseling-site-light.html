<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عماد أبو يونس — مستشار أسري وزوجي</title>
<meta name="description" content="كل بيت عالم. وكل إنسان يرى الحكاية من باب مختلف. مساحة محتوى وثقة مع عماد أبو يونس، مستشار أسري وزوجي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F2EADA;
  --ivory-2:#FAF5E9;
  --charcoal:#2A241C;
  --charcoal-soft:#5D5340;
  --olive:#4B5236;
  --olive-deep:#343A25;
  --burgundy:#7C2E2A;
  --burgundy-deep:#5E211E;
  --gold:#B48A46;
  --gold-soft:#D9BA85;
  --line:rgba(42,36,28,0.14);
  --shadow:0 10px 30px rgba(42,36,28,0.12);
  color-scheme: light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ivory:#211C15;
    --ivory-2:#2A241B;
    --charcoal:#EFE6D4;
    --charcoal-soft:#C7BBA1;
    --line:rgba(239,230,212,0.16);
    --shadow:0 10px 30px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ivory:#211C15;
  --ivory-2:#2A241B;
  --charcoal:#EFE6D4;
  --charcoal-soft:#C7BBA1;
  --line:rgba(239,230,212,0.16);
  --shadow:0 10px 30px rgba(0,0,0,0.4);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--ivory);
  color:var(--charcoal);
  font-family:'IBM Plex Sans Arabic','Tahoma',sans-serif;
  direction:rtl;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;}
h1,h2,h3,h4{
  font-family:'Noto Kufi Arabic','Tahoma',sans-serif;
  margin:0 0 .4em;
  font-weight:700;
  color:var(--charcoal);
  line-height:1.35;
}
p{margin:0 0 1em;color:var(--charcoal-soft);}
.eyebrow{
  font-size:.82rem;
  color:var(--burgundy);
  font-weight:600;
  margin:0 0 .5em;
}
:root[data-theme="dark"] .eyebrow, :root:not([data-theme="light"]) .eyebrow{ color:var(--gold-soft); }
.hairline{height:1px;background:var(--line);border:0;margin:48px 0;}

/* focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--burgundy);
  outline-offset:3px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

/* ---------- header ---------- */
.site-header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--ivory) 92%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.site-header .row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1120px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-name{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:1.25rem;}
.brand-title{font-size:.72rem;color:var(--charcoal-soft);display:block;margin-top:-2px;}
.nav-desktop{display:none;gap:26px;align-items:center;}
.nav-desktop a{font-size:.95rem;color:var(--charcoal-soft);white-space:nowrap;}
.nav-desktop a.active, .nav-desktop a:hover{color:var(--burgundy);}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:11px 22px;border-radius:999px;font-size:.92rem;font-weight:600;
  border:1px solid transparent;cursor:pointer;
}
.btn-primary{background:var(--burgundy);color:#fff;}
.btn-primary:hover{background:var(--burgundy-deep);}
.btn-ghost{background:transparent;border-color:var(--charcoal);color:var(--charcoal);}
.btn-ghost:hover{border-color:var(--burgundy);color:var(--burgundy);}
.btn-outline-inv{background:transparent;border-color:#fff;color:#fff;}
.menu-toggle{
  display:inline-flex;background:transparent;border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;color:var(--charcoal);
}
.mobile-menu{
  display:none;flex-direction:column;gap:2px;
  border-top:1px solid var(--line);background:var(--ivory);
}
.mobile-menu.open{display:flex;}
.mobile-menu a{padding:14px 20px;border-bottom:1px solid var(--line);font-size:1rem;}
.mobile-menu .btn{margin:14px 20px;}
@media(min-width:860px){
  .nav-desktop{display:flex;}
  .menu-toggle{display:none;}
}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg, var(--ivory-2), var(--ivory));
}
.hero .wrap{
  display:grid;gap:28px;align-items:center;
  padding:44px 20px 56px;
}
@media(min-width:900px){
  .hero .wrap{grid-template-columns:1.1fr .9fr;padding:72px 20px 84px;}
}
.hero-kicker{font-size:.85rem;color:var(--burgundy);font-weight:600;margin-bottom:14px;}
.hero h1{font-size:clamp(1.9rem,5.4vw,3rem);}
.hero .motto{font-size:1.05rem;color:var(--charcoal-soft);max-width:44ch;margin-bottom:26px;}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;}
.hero-figure{
  position:relative;border-radius:200px 200px 24px 24px;overflow:hidden;
  aspect-ratio:4/5;box-shadow:var(--shadow);border:1px solid var(--line);
}
.hero-figure img{width:100%;height:100%;object-fit:cover;}

/* ---------- today bar (doors) ---------- */
.today-bar{padding:40px 0 8px;}
.today-bar .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.doors-scroll{
  display:flex;gap:16px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x proximity;
  -ms-overflow-style:none;scrollbar-width:thin;
}
.door-card{
  scroll-snap-align:start;flex:0 0 148px;text-align:center;
}
.door-shape{
  width:148px;height:190px;border-radius:74px 74px 16px 16px;
  overflow:hidden;position:relative;border:1px solid var(--line);
  box-shadow:0 6px 18px rgba(42,36,28,0.10);
  transition:transform .2s ease, box-shadow .2s ease;
}
.door-card:hover .door-shape{transform:translateY(-4px);box-shadow:0 14px 26px rgba(42,36,28,0.18);}
.door-shape img{width:100%;height:100%;object-fit:cover;}
.door-shape::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(42,36,28,0) 45%, rgba(20,17,12,.72) 100%);
}
.door-label{
  position:absolute;bottom:10px;right:0;left:0;color:#fff;font-size:.86rem;font-weight:600;
  padding:0 10px;z-index:2;line-height:1.3;
}
.door-card .cap{margin-top:10px;font-size:.8rem;color:var(--charcoal-soft);}

/* ---------- grids & cards ---------- */
.section{padding:40px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.section-head p{margin:6px 0 0;max-width:56ch;}
.link-more{font-size:.9rem;color:var(--burgundy);font-weight:600;white-space:nowrap;}
.link-more:hover{text-decoration:underline;}

.grid-articles{display:grid;gap:20px;grid-template-columns:1fr;}
@media(min-width:640px){.grid-articles{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.grid-articles{grid-template-columns:repeat(3,1fr);}}

.card-article{
  background:var(--ivory-2);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;height:100%;
}
.card-article .swatch{
  height:8px;
}
.card-article .world-thumb{aspect-ratio:4/3;overflow:hidden;background:var(--line);}
.card-article .world-thumb img{width:100%;height:100%;object-fit:cover;}
.card-article .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card-article .tag{font-size:.72rem;color:var(--olive);font-weight:600;}
:root[data-theme="dark"] .card-article .tag, :root:not([data-theme="light"]) .card-article .tag{color:var(--gold-soft);}
.card-article h3{font-size:1.08rem;margin:0;}
.card-article .cta{font-size:.86rem;color:var(--charcoal-soft);margin-top:auto;padding-top:6px;}
.card-article .demo-flag{font-size:.68rem;color:var(--burgundy);border:1px solid var(--burgundy);border-radius:6px;padding:1px 6px;display:inline-block;width:fit-content;}

.feature{
  display:grid;gap:24px;background:var(--ivory-2);border:1px solid var(--line);border-radius:22px;overflow:hidden;
}
@media(min-width:820px){.feature{grid-template-columns:1fr 1fr;align-items:stretch;}}
.feature .img-side{min-height:220px;}
.feature .img-side img{width:100%;height:100%;object-fit:cover;}
.feature .txt-side{padding:28px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;}

/* two rich paths */
.paths-two{display:grid;gap:24px;}
@media(min-width:820px){.paths-two{grid-template-columns:1fr 1fr;}}
.path-block{border:1px solid var(--line);border-radius:20px;padding:24px;background:var(--ivory-2);}
.path-block .mini-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.path-block .mini-list li{font-size:.92rem;padding-right:16px;position:relative;color:var(--charcoal-soft);}
.path-block .mini-list li::before{content:"—";position:absolute;right:0;color:var(--gold);}

/* imagine this scene */
.scene-block{
  border-radius:22px;padding:34px 28px;background:var(--olive-deep);color:var(--ivory-2);
  position:relative;
}
.scene-block h2{color:var(--ivory-2);}
.scene-block p{color:rgba(250,245,233,.85);font-size:1.05rem;max-width:66ch;}

/* video strip */
.trust-grid{display:grid;gap:18px;}
@media(min-width:760px){.trust-grid{grid-template-columns:1fr 1fr;}}
.trust-card{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--ivory-2);}
.trust-card h3{font-size:1.05rem;}
.trust-card ul{margin:0;padding-inline-start:20px;color:var(--charcoal-soft);}
.trust-card li{margin-bottom:8px;}

/* faq */
.faq-item{border-bottom:1px solid var(--line);padding:18px 0;}
.faq-item summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item summary .ic{color:var(--gold);}
.faq-item[open] summary .ic{transform:rotate(45deg);}
.faq-item p{margin-top:12px;}

/* sanad */
.sanad-box{display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);border-radius:20px;padding:26px;background:var(--ivory-2);}
@media(min-width:760px){.sanad-box{flex-direction:row;align-items:center;}}
.sanad-logo{
  width:56px;height:56px;border-radius:14px;background:var(--burgundy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Noto Kufi Arabic',sans-serif;font-size:1.3rem;flex:0 0 auto;
}

/* final cta */
.final-cta{
  border-radius:24px;padding:40px 28px;text-align:center;
  background:radial-gradient(circle at 30% 20%, var(--burgundy-deep), var(--charcoal) 120%);
  color:#fff;
}
.final-cta h2{color:#fff;}
.final-cta p{color:rgba(255,255,255,.8);max-width:52ch;margin-inline:auto;}

/* footer */
.site-footer{border-top:1px solid var(--line);padding:44px 0 30px;margin-top:20px;background:var(--ivory-2);}
.footer-grid{display:grid;gap:28px;}
@media(min-width:760px){.footer-grid{grid-template-columns:1.3fr 1fr 1fr;}}
.footer-grid h4{font-size:.95rem;}
.footer-grid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.footer-grid a{color:var(--charcoal-soft);font-size:.9rem;}
.footer-grid a:hover{color:var(--burgundy);}
.footer-bottom{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:.8rem;color:var(--charcoal-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

/* ---------- world page ---------- */
.world-hero{position:relative;min-height:280px;display:flex;align-items:flex-end;overflow:hidden;}
.world-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.world-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,17,12,.15), rgba(20,17,12,.82));}
.world-hero .in{position:relative;z-index:2;color:#fff;padding:60px 20px 34px;width:100%;}
.world-hero h1{color:#fff;font-size:clamp(1.8rem,5vw,2.6rem);}
.world-hero .q{color:rgba(255,255,255,.85);font-size:1.05rem;max-width:50ch;}
.crumb{font-size:.82rem;color:rgba(255,255,255,.75);margin-bottom:10px;display:block;}
.crumb a{text-decoration:underline;}

.subcase-grid{display:grid;gap:16px;grid-template-columns:1fr;}
@media(min-width:640px){.subcase-grid{grid-template-columns:1fr 1fr;}}
.subcase-card{border:1px solid var(--line);background:var(--ivory-2);border-radius:16px;padding:18px 20px;}
.subcase-card h3{font-size:1rem;margin-bottom:6px;}
.subcase-card p{font-size:.9rem;margin:0;}

.related-worlds{display:flex;gap:12px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.86rem;
  background:var(--ivory-2);
}
.chip:hover{border-color:var(--burgundy);color:var(--burgundy);}

/* ---------- article page ---------- */
.article-head{padding:52px 0 20px;}
.article-head .eyebrow{margin-bottom:10px;}
.article-head h1{font-size:clamp(1.7rem,4.6vw,2.4rem);max-width:26ch;}
.byline{display:flex;align-items:center;gap:12px;margin-top:20px;}
.byline img{width:46px;height:46px;border-radius:50%;object-fit:cover;}
.byline .n{font-weight:600;font-size:.92rem;}
.byline .r{font-size:.8rem;color:var(--charcoal-soft);}
.article-body{max-width:70ch;font-size:1.05rem;}
.article-body h2{font-size:1.3rem;margin-top:1.4em;}
.article-body p{color:var(--charcoal);}
.pull-cta{
  border-right:3px solid var(--gold);padding:6px 18px;margin:28px 0;color:var(--charcoal-soft);font-style:italic;
}
.demo-note{
  background:var(--ivory-2);border:1px dashed var(--line);border-radius:12px;padding:14px 18px;font-size:.85rem;color:var(--charcoal-soft);margin-bottom:24px;
}

/* ---------- library ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
.filter-btn{
  border:1px solid var(--line);background:var(--ivory-2);border-radius:999px;
  padding:8px 16px;font-size:.86rem;cursor:pointer;color:var(--charcoal-soft);
}
.filter-btn.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}

/* ---------- about ---------- */
.about-hero{display:grid;gap:28px;align-items:center;}
@media(min-width:860px){.about-hero{grid-template-columns:.9fr 1.1fr;}}
.about-hero .ph{border-radius:24px;overflow:hidden;aspect-ratio:4/5;border:1px solid var(--line);box-shadow:var(--shadow);}
.about-hero .ph img{width:100%;height:100%;object-fit:cover;}
.creds{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:18px;}
.creds .c{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--ivory-2);font-size:.86rem;}
.creds .c b{display:block;font-size:.78rem;color:var(--olive);margin-bottom:4px;}
:root[data-theme="dark"] .creds .c b, :root:not([data-theme="light"]) .creds .c b{color:var(--gold-soft);}

/* ---------- booking ---------- */
.option-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;}
@media(min-width:600px){.option-grid{grid-template-columns:repeat(3,1fr);}}
.opt{
  border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;
  background:var(--ivory-2);font-size:.92rem;
}
.opt.sel{border-color:var(--burgundy);color:var(--burgundy);background:color-mix(in srgb, var(--burgundy) 8%, var(--ivory-2));}
.form-field{margin-bottom:18px;}
.form-field label{display:block;font-size:.9rem;margin-bottom:7px;font-weight:600;}
.form-field input, .form-field textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--ivory-2);color:var(--charcoal);font-family:inherit;font-size:.95rem;
}
.form-field textarea{min-height:90px;resize:vertical;}
.disclaimer{font-size:.8rem;color:var(--charcoal-soft);margin-top:16px;}

/* ai assistant strip */
.ai-strip{
  border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:var(--ivory-2);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.ai-strip .txt{flex:1;min-width:220px;}
.ai-strip .warn{font-size:.78rem;color:var(--burgundy);margin-top:4px;}

.page-fade{animation:pf .35s ease both;}
@keyframes pf{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

</style>
</head>
<body>
<div id="header-slot"></div>
<main id="app"></main>

{id:1,title:"ما الذي جعل جيلًا كاملًا يقول: فِش عروس؟",world:"engagement",audience:"شاب؛ شابة؛ أهل",cta:"اختبر إن كانت المشكلة في الخيارات أم في الدائرة",scene:"يجلس شاب مع أهله مساء الجمعة، وكلما ذُكر الزواج قالوا إن البنات لا يناسبنه. وفي بيت آخر تقول شابة الكلام نفسه عن الشباب، ثم يعود كلٌّ منهما إلى الدائرة ذاتها.",idea:"عبارة «فِش عروس» لا تعني دائمًا غياب الراغبين في الزواج. قد تكشف دائرة اجتماعية مغلقة، أو شروطًا متناقضة، أو خوفًا يجعل كل فرصة تبدو ناقصة. الشاب والفتاة قد يريدان الارتباط فعلًا، لكنهما يبحثان بالطريقة نفسها ويتوقعان نتيجة مختلفة في النهاية.",step:"اكتب ثلاثة شروط ضرورية وثلاثة يمكن التفاوض حولها، ثم اختبر إن كانت المشكلة في الخيارات أم في دائرتك."},
{id:2,title:"ماذا يعني زواج ناجح؟ ولمن هو ناجح؟",world:"marriage",audience:"زوج؛ زوجة",cta:"إذا اختلف تعريف النجاح بينكما فالجلسة تساعدكما على تسميته",scene:"يصف الزوج نجاح الزواج بأنه بيت مستقر وأطفال بخير، بينما تراه الزوجة علاقة فيها قرب وحديث واهتمام. كلاهما يظن أنه يؤدي المطلوب، وكلاهما يشعر أن الآخر لا يراه.",idea:"قد يبدو الزواج ناجحًا أمام العائلة والجيران، لكنه لا يحمل المعنى نفسه لمن يعيش داخله. لا يوجد تعريف واحد يناسب الجميع؛ المشكلة تبدأ حين يتحول تعريف طرف واحد إلى القانون الوحيد. النجاح يحتاج معنى مشتركًا يضم الأمان والاحترام والمسؤولية وما يحتاجه كل شريك.",step:"اكتب كل منكما ثلاث علامات لزواج ناجح، ثم قارنا القائمتين وسمّيا نقطة الاختلاف الأهم بينكما."},
{id:3,title:"كيف يصبح الرجل الذي تزوّجته عن حب… رجلًا لا يُطاق؟",world:"marriage",audience:"زوجة؛ زوج",cta:"افهما التحول قبل أن تحكما على النهاية",scene:"كانت تنتظر رسائله حتى منتصف الليل، واليوم تضيق من صوت مفتاحه في الباب. وهو أيضًا لم يعد يفهم كيف تحولت المرأة التي أحبته إلى شخص يتوقع منه الخطأ قبل الكلام.",idea:"لا يتحول الإنسان عادة في يوم واحد؛ تتراكم خيبات صغيرة، وضغوط، وأدوار لم تُناقش، وصور مثالية لا يحتملها الواقع. قد يتغير الرجل، وقد تتغير المرأة، وقد تتغير الطريقة التي ينظر بها كل واحد إلى الآخر. فهم المسار لا يبرر الأذى، لكنه يمنع اختزال سنوات في صفة واحدة.",step:"اختارا تغيرًا واحدًا لاحظتماه وحددا متى بدأ وما الذي سبقه، قبل أن تحكما على نهاية العلاقة."},
{id:4,title:"الأم المسيطرة داخل البيت والزوج الهادئ وفقدان الأبناء",world:"kids",audience:"أب؛ أم",cta:"أعيدوا توزيع الأدوار قبل أن يصبح الطفل ساحة الصراع",img:"kids_tense",scene:"عندما يطلب الابن شيئًا ينظر إلى أمه أولًا، وحين يعترض الأب تتدخل فتُنهي النقاش. بمرور الوقت صار الأب حاضرًا في البيت، لكنه خارج كل قرار حقيقي.",idea:"السيطرة لا تحتاج صراخًا دائمًا، والهدوء لا يعني موافقة أو حكمة دائمًا. حين يحتكر أحد الوالدين القرار وينسحب الآخر، يتعلم الأبناء الالتفاف بينهما بدل احترامهما. المسؤولية هنا مشتركة: طرف يحتاج أن يخفف قبضته، وطرف يحتاج أن يستعيد صوته من دون حرب.",step:"اتفقا هذا الأسبوع على قرار واحد يخص الأبناء، وناقشاه منفردين قبل إعلانه بصوت والدين متفقين."},
{id:5,title:"إذا لم يكن لك مقعد على الطاولة فأنت على قائمة الطعام",world:"boundaries",audience:"عام",cta:"سمِّ حدودك قبل أن تُستهلك",scene:"كانوا يتخذون القرارات في الجلسة نفسها، ثم يطلبون منه التنفيذ بعد انتهائها. كلما اعترض قالوا إنه حساس، وكلما وافق شعر أنه يتحول من شريك إلى أداة.",idea:"المقعد على الطاولة ليس كرسيًا، بل حق في المعرفة والتأثير والرفض. من يُستدعى فقط عندما يحتاجه الآخرون قد يكون جزءًا من الخطة لا شريكًا فيها. وضع الحدود لا يعني الخصومة؛ يعني أن يعرف الناس أين ينتهي تعاونك وأين يبدأ استهلاكك.",step:"اختر موقفًا واحدًا يتكرر، وقل بوضوح ما ستقبله وما لن تفعله بعد اليوم، من دون تهديد."},
{id:6,title:"حين تصبح غرفة في البيت زنزانة لطفل",world:"kids",audience:"أب؛ أم؛ ابن؛ ابنة",cta:"افتحوا باب الحوار قبل باب الغرفة",img:"kids_tense",scene:"يعود الطفل من المدرسة، يغلق باب غرفته، ويقضي ساعات بين الهاتف والسقف. يظن الأهل أنه يحب العزلة، بينما صار الباب المغلق طريقته الوحيدة كي لا يُسأل ولا يُنتقد.",idea:"الغرفة قد تكون مساحة خصوصية صحية، وقد تصبح زنزانة حين يشعر الطفل أن الخروج منها يعني محاضرة أو مقارنة أو شجارًا. اقتحام الباب يزيد الحصار، وتجاهل ما يحدث يتركه وحده. المطلوب علاقة تجعل البيت مكانًا يمكن الظهور فيه بلا خوف.",step:"اطرق الباب اليوم، وادخل بلا أسئلة كثيرة؛ اجلس عشر دقائق لشيء يحبه، ثم افتح باب الحوار."},
{id:7,title:"حين يصبح الزواج: أنت فعلت… وأنا سأفعل",world:"marriage",audience:"زوج؛ زوجة",cta:"أوقفا دفتر الحساب قبل أن يبتلع العلاقة",scene:"تأخر مرة، فتأخرت في الرد عليه عمدًا. انتقدها أمام أهله، فذكّرته بخطئه أمام أصدقائه. لم يعد الخلاف عن المشكلة الأولى، بل عن مَن يوجع الآخر أكثر.",idea:"حين يصبح الزواج ردود أفعال انتقامية، يتحول الألم إلى عملة يدفع بها الطرفان. كل واحد يملك سببًا مفهومًا لغضبه، لكن تبرير الضربة بضربة أخرى يبني دفتر حساب لا علاقة. العدالة بين الزوجين ليست تساوي الأذى، بل توقفه ومناقشة أصله تمامًا.",step:"أوقفا ردًا انتقاميًا واحدًا هذا الأسبوع، وتحدثا عن الجرح الأول بدل إضافة بند جديد إلى الحساب."},
{id:8,title:"الزواج لا ينجح وحده… ويُتعب من يحمله وحده",world:"marriage",audience:"زوج؛ زوجة",cta:"إذا كان واحد يحمل الزواج وحده فهذه إشارة للجلسة",scene:"هي ترتب المواعيد والبيت والأطفال وتبدأ كل حديث صعب، أو هو يعمل ويصالح ويتنازل وحده. الطرف الآخر موجود، لكن العلاقة تتحرك بجهد شخص واحد فقط.",idea:"يمكن لشخص أن يحمل الزواج فترة، لكنه لا يستطيع أن يحمله إلى الأبد. التعب لا يثبت دائمًا أن الطرف الآخر سيئ؛ أحيانًا لم تُسمَّ المسؤوليات، أو صار العطاء عادة غير مرئية. المشكلة تبدأ حين يُطلب من المتعب أن يبذل أكثر كي لا يسقط كل شيء.",step:"اكتبا مسؤوليات العلاقة كما هي اليوم، ثم انقلا مهمة واحدة كاملة من الطرف المُنهك إلى الطرف الآخر."},
{id:9,title:"الطلاق الذي يحدث قبل أن يذهب أحد إلى المحكمة",world:"divorce",audience:"زوج؛ زوجة؛ منفصل",cta:"افهما هل انتهت العلاقة أم انقطع الكلام فقط",scene:"ما زالا يعيشان في البيت نفسه، لكنهما لا يتحدثان إلا عن الفواتير والأطفال. لا شجار كبيرًا بينهما، فقط حياة مرتبة يتصرف فيها كل واحد كأن الآخر غير موجود.",idea:"قد يبدأ الطلاق قبل الأوراق حين ينقطع الفضول واللمس والكلام، ويصبح وجود الشريك تفصيلًا إداريًا. لكن الصمت وحده لا يثبت أن العلاقة انتهت؛ قد يكون انسحابًا من ألم لم يعرفا كيف يناقشانه. التمييز بين النهاية والانقطاع يحتاج صدقًا لا افتراضًا.",step:"خصصا نصف ساعة بلا هواتف واسألا سؤالًا واحدًا: هل انتهت العلاقة فعلًا، أم انقطع الكلام بيننا؟"},
{id:10,title:"عمر الزهرة قصير… والحب المجنون أيضًا",world:"engagement",audience:"مخطوب؛ مخطوبة",cta:"ابنيا ما يبقى بعد هدوء الاندفاع",scene:"في الأشهر الأولى كانا يتركان أعمالهما ليلتقيا، ويتحدثان حتى الفجر. بعد أن هدأ الاندفاع، خاف كل واحد منهما أن يكون هدوء العلاقة دليلًا على موت الحب.",idea:"الحب المشتعل جميل، لكنه لا يبقى بالقوة نفسها؛ الجسد والوقت والحياة يعيدون الإيقاع إلى طبيعته. الهدوء ليس خيانة للبداية، وقد يكون أول فرصة لرؤية الإنسان الحقيقي خلف الانبهار. ما يبقى يحتاج توافقًا وعناية وقدرة على احتمال الأيام العادية معًا فعلًا.",step:"اختارا عادة أسبوعية صغيرة تستطيعان الاستمرار بها بعد هدوء الاندفاع، واجعلاها جزءًا ثابتًا من علاقتكما."},
{id:11,title:"الخِطبة ليست بروفة لحفل الزفاف",world:"engagement",audience:"مخطوب؛ مخطوبة؛ أهل",cta:"اسألا الأسئلة التي لا يجيب عنها الحفل",scene:"أمضيا الخطبة في اختيار القاعة والأثاث والتصوير، وكلما ظهر اختلاف بينهما قالا: نحلّه بعد الزواج. جاء الحفل كاملًا، ودخلت الأسئلة المؤجلة معهما إلى البيت الجديد.",idea:"الخطبة ليست وقت انتظار بين الطلب والعرس، بل مساحة لاختبار طريقة التفكير والاختلاف. لا تكشف الحفلات الموقف من المال والأهل والعمل والأطفال والخصوصية. التوافق لا يعني إجابات متطابقة، بل قدرة مشتركة على مناقشة الفروق قبل أن تصبح التزامات يومية ثقيلة.",step:"أوقفا حديث التحضيرات لساعة، واسألا بعضكما ثلاثة أسئلة صعبة لا يجيب عنها الحفل ولا تؤجل إلى الزواج."},
{id:12,title:"الفجوة بين الشاب والفتاة: الجميع يريد الزواج ولا أحد يصل",world:"engagement",audience:"شاب؛ شابة",cta:"افهما أين تتعطل الطريق",scene:"يقول الشاب إنه يبحث بجد، وتقول الشابة إنها جاهزة للزواج، لكن لقاءاتهما تنتهي سريعًا. كل طرف يدخل محمّلًا بصورة عن الآخر قبل أن يسمع منه جملة كاملة.",idea:"الفجوة ليست نقصًا في الرغبة فقط؛ قد تكون اختلافًا في التوقعات واللغة والواقع الاقتصادي ومعنى الشراكة. حين يبحث كل طرف عن نسخة تؤكد أفكاره، يصبح اللقاء امتحانًا لا تعارفًا. الوصول الحقيقي يبدأ بفهم ما يعطّل الطريق لا باتهام جيل كامل.",step:"بعد اللقاء المقبل، اكتب ما سمعته فعلًا وما افترضته، ثم حدّد أين تعطلت الطريق بينكما."},
{id:13,title:"لن تجد عروسًا وأنت تعيش في الدائرة نفسها كل يوم",world:"engagement",audience:"شاب",cta:"وسّع حياتك قبل قائمة شروطك",scene:"يعمل مع الأشخاص أنفسهم، ويجلس في المقهى نفسه، ويقضي عطلته مع الأصدقاء أنفسهم. ثم يقول إن كل محاولات التعارف تأتي بالشخصيات ذاتها ولا تقوده إلى علاقة مناسبة.",idea:"ليست المشكلة دائمًا في غياب العروس، بل في أن الحياة لا تفتح نافذة جديدة. توسيع الدائرة لا يعني ملاحقة الناس أو تحويل كل نشاط إلى مشروع زواج. يعني بناء حياة أوسع تُظهر شخصيتك وتعرّفك إلى بشر جدد خارج القائمة المعتادة.",step:"انضم هذا الشهر إلى نشاط جديد يناسب اهتمامك، ووسّع حياتك أولًا قبل أن توسّع قائمة شروطك."},
{id:14,title:"لماذا تحمل بعض النساء اسم عائلتها واسم عائلة زوجها؟",world:"marriage",audience:"امرأة؛ رجل؛ عام",cta:"اقرأ الاسم بوصفه هوية لا إجراءً",scene:"كتبت اسم عائلتها إلى جانب اسم زوجها، فاتهمها بعضهم بأنها تخلت عن أصلها القديم. وحين أبقت اسمها وحده، رأى آخرون في ذلك رفضًا واضحًا لزوجها.",idea:"الاسم ليس خانة محايدة دائمًا؛ يحمل ذاكرة وانتماءً وعلاقة وصورة اجتماعية. بعض النساء يجمعن الاسمين، وبعضهن يخترن أحدهما، ولكل اختيار سياقه. تحويل الاسم إلى اختبار ولاء يسلب المرأة حقها في تعريف نفسها، ويحمّل الزوج معنى إضافيًا قد لا يريده أصلًا.",step:"اسأل صاحبة الاسم ماذا يعني اختيارها لها، واقرأه بوصفه هوية شخصية لا إجراءً يحتاج محاكمة."},
{id:15,title:"حين يصبح لباس البنت معركة يومية مع أمها",world:"kids",audience:"أم؛ ابنة؛ أب",cta:"حوّلوا المعركة إلى لغة وحدود",img:"kids_tense",scene:"تقف البنت أمام المرآة، وتدخل أمها لتطلب منها تغيير ملابسها فورًا. خلال دقائق يصبح القميص خلافًا عن الاحترام والناس والتربية، ويتحول الأب إلى قاضٍ بينهما.",idea:"معركة اللباس نادرًا ما تكون عن القماش وحده؛ خلفها خوف الأم، وحاجة البنت إلى امتلاك جسدها وصورتها، وحيرة الأب بين الحماية والسيطرة. الصراخ يجعل كل طرف يدافع عن كرامته بدل فهم الآخر. الحدود الصحية تحتاج تفسيرًا واتفاقًا لا إذلالًا يوميًا.",step:"اختاروا وقتًا بعيدًا عن باب الخروج، وناقشوا لباسًا واحدًا بلغة المخاوف والحدود لا بلغة الاتهام."},
{id:16,title:"هل ابنك في خطر… أم أن خوفك هو الذي كبر؟",world:"kids",audience:"أب؛ أم",cta:"ميّزوا الخطر الحقيقي من الخوف",img:"kids_tense",scene:"تأخر الابن نصف ساعة ولم يجب هاتفه، فتصورت الأم حادثًا، وتوقع الأب رفقة سيئة. عاد طبيعيًا، لكنه وجد تحقيقًا كاملًا بانتظاره قبل أن يخلع حذاءه.",idea:"الخوف على الأبناء طبيعي، لكنه قد يكبر حتى يصبح هو الذي يقود البيت. ليست كل إشارة خطرًا، وليس كل اطمئنان سذاجة. المراقبة الدائمة قد تدفع الابن إلى إخفاء التفاصيل، بينما السؤال الهادئ والقواعد المتفق عليها يبنيان مسؤولية حقيقية يمكن قياسها.",step:"حدّدوا مؤشرين واقعيين للخطر وقاعدة اتصال واضحة، ثم ميّزوا بين ما حدث فعلًا وما صنعه الخوف."},
{id:17,title:"حين تجنّد الأم البيت كله ضد ابنها",world:"kids",audience:"أم؛ أب؛ ابن",cta:"أوقفوا التحالفات داخل البيت",img:"kids_tense",scene:"اختلفت الأم مع ابنها، فاتصلت بأبيه وأخته وجدته وروت لكل واحد نسختها. عاد الابن مساءً ليجد البيت كله يتحدث معه كأنه متهم أمام لجنة كبيرة.",idea:"الاستعانة بالأسرة قد تبدو طلبًا للدعم، لكنها تصبح تحالفًا حين يُحاصر شخص واحد بأصوات الجميع. الابن قد يخطئ، والأم قد تتأذى، لكن تحويل الخلاف إلى حملة يمنع الاعتراف والإصلاح. البيت يحتاج مواجهة مباشرة بين أصحاب المشكلة، لا جمهورًا يوزع الأحكام.",step:"أعيدوا الخلاف إلى طرفيه، واطلبوا من بقية العائلة التوقف عن التدخل حتى تنتهي محادثة مباشرة بينهما."},
{id:18,title:"الولد الذي لا يُسمح له أن يحزن",world:"kids",audience:"أب؛ أم؛ ابن",cta:"امنحوه لغة للحزن لا أمرًا بالصمت",img:"kids_tense",scene:"عاد الولد باكيًا بعد خسارة فريقه أو خلافه مع صديق، فقيل له: كن رجلًا. مسح وجهه سريعًا، ثم تعلّم مع الوقت أن يغضب بدل أن يقول إنه موجوع.",idea:"منع الحزن لا يصنع صلابة؛ قد يدفع المشاعر إلى أبواب أخرى مثل العصبية أو الانسحاب أو السخرية. الولد يحتاج أن يعرف أن الرجولة لا تلغي الخوف والخيبة. الاعتراف بمشاعره لا يعفيه من المسؤولية، بل يمنحه لغة واضحة كي يتعامل معها.",step:"عندما يحزن، لا تطلب منه التوقف؛ سمِّ ما تراه واسأله أين يشعر به، وامنحه لغة بدل الصمت."},
{id:19,title:"البنت التي تعيش تحت المراقبة طوال الوقت",world:"kids",audience:"أب؛ أم؛ ابنة",cta:"ابنوا أمانًا لا سجنًا",img:"kids_tense",scene:"تسأل الأم ابنتها أين ذهبت ومع من وماذا قالت، ويفحص الأب هاتفها بحجة الحماية. صارت البنت تعطي إجابات قصيرة، لا لأنها آمنة، بل لأنها تتجنب التحقيق.",idea:"الرقابة قد تبدأ من خوف حقيقي، لكنها إذا شملت كل تفصيل تحوّل البيت إلى مكان لإخفاء الحياة. الثقة لا تعني غياب القواعد، والخصوصية لا تعني أن تفعل الابنة ما تشاء. الأمان ينمو حين تعرف الحدود وأسبابها وما يحدث عند خرقها.",step:"اتفقوا على ثلاث قواعد حماية واضحة، واتركوا ما عداها مساحة خاصة؛ ابنوا أمانًا يمكن الحديث داخله."},
{id:20,title:"بعض الأشجار يمكن اقتلاعها بنسمة عابرة",world:"boundaries",audience:"عام",cta:"قوِّ الجذور بدل لوم الريح",scene:"انتقده شخص عابر، فتغير مزاجه أسبوعًا كاملًا. انتهت علاقة قصيرة، فشعر أن حياته كلها اقتُلعت، كأن الجذور لم تكن ممسكة بشيء ثابت قبل هبوب الريح.",idea:"ليست كل ريح قوية؛ أحيانًا تكون الجذور متعبة أو مبنية على قبول الآخرين وحده. الحساسية ليست عيبًا، لكنها تصبح قيدًا حين تحدد كل كلمة قيمة الإنسان. تقوية الداخل الهادئة لا تمنع الألم، بل تمنعه من تعريف الحياة كلها وإسقاطها بسهولة.",step:"اختر قيمة فيك لا تعتمد على رأي أحد، ودوّن موقفين يثبتانها؛ قوِّ الجذور بدل لوم الريح."},
{id:21,title:"بعد الطلاق: لا تجعلوا الطفل رسولًا بينكما",world:"divorce",audience:"أب؛ أم؛ منفصل",cta:"احموا الطفل من بريد الكبار",scene:"يقول الأب لطفله: أخبر أمك أنني لن أدفع. وترد الأم: قل لأبيك إن موعده تغيّر. يحمل الطفل الرسالتين ويخاف من الرد قبل أن يفهم المشكلة.",idea:"بعد الطلاق قد يصعب الحديث المباشر، لكن استخدام الطفل يحوله إلى بريد يحمل غضب الكبار ولا يملك حق رفضه. الأب والأم قد يكونان مجروحين، إلا أن الابن ليس وسيطًا ولا شاهدًا ولا قاضيًا. حمايته الحقيقية تبدأ بإبعاده عن التفاوض واللوم.",step:"افتحا قناة مكتوبة ومحايدة بينكما للمواعيد والمصاريف، وامتنعا أسبوعًا كاملًا عن إرسال أي رسالة عبر الطفل."},
{id:22,title:"فشل الحياة الزوجية قد يشبه الفقد",world:"breakup",audience:"منفصل؛ زوج؛ زوجة",cta:"اسمح للحزن أن يُفهم قبل القرار التالي",scene:"انتهى الزواج رسميًا، لكن أحدهما ما زال يستيقظ وفي ذهنه البيت القديم وصوت المفاتيح. الناس يطلبون منه أن يبدأ من جديد، بينما هو يودع حياة كاملة.",idea:"فشل الزواج لا يعني غياب الحب أو أن الحزن ضعف. الإنسان لا يفقد شريكًا فقط؛ قد يفقد روتينًا وهوية وخطة مستقبل ومكانًا كان يسميه بيتًا. للطرفين حق كامل في الحداد بطريقتهما، من دون تحويل الألم إلى حكم أبدي على الذات.",step:"اكتب ثلاثة أشياء فقدتها غير الشخص نفسه، واسمح لهذا الحزن أن يُفهم قبل اتخاذ قرار العلاقة التالية."},
{id:23,title:"غيّرت عملي بعد 18 عامًا… فهل أغيّر زوجي بعد 27؟",world:"marriage",audience:"زوج؛ زوجة",cta:"ميّزوا بين الحاجة إلى التغيير والحاجة إلى الهرب",scene:"غيّرت عملها بعد ثمانية عشر عامًا وشعرت أنها ولدت من جديد، ثم نظرت إلى زواجها القديم وسألت: إذا كان التغيير أنقذني هناك، فلماذا لا ينقذني هنا؟",idea:"الرغبة في التغيير لا تعني دائمًا أن الزوج هو المشكلة، كما أن طول الزواج لا يوجب البقاء بأي ثمن. قد يحتاج الإنسان حياة أوسع داخل العلاقة، وقد تكون العلاقة نفسها استُنزفت. السؤال الأدق ليس: أغيّر أم أبقى؟ بل: ممَّ أهرب وإلى ماذا أريد الوصول؟",step:"افصلي بين ما تريدين تغييره في حياتك وما تريدين تغييره في زوجك، ثم قارني القائمتين بهدوء."},
{id:24,title:"الحزن الذي يبدأ قبل الوفاة",world:"grief",audience:"مرافق مريض؛ أسرة",cta:"لا تحمل الحزن الاستباقي وحدك",scene:"يجلس قرب سرير أبيه ويسمع الأطباء يتحدثون عن الاحتمالات الصعبة. الأب ما زال حيًا أمامه، لكنه يبدأ سرًا بتخيل البيت من دونه ثم يشعر بالذنب.",idea:"قد يبدأ الحزن قبل الوفاة عندما يرى الإنسان تغيّر من يحب ويخاف النهاية القادمة. هذا لا يعني أنه تخلّى عنه أو استعجل موته؛ إنه يحاول استيعاب فقد محتمل وهو ما زال يقوم بدور المرافق. كتمان هذا الحزن يزيد الوحدة في وقت يحتاج فيه إلى سند.",step:"اختر شخصًا آمنًا وقل له ما تخشاه بصراحة؛ لا تحمل الحزن الاستباقي وحدك خلف باب المستشفى."},
{id:25,title:"المرافق يتألم أيضًا… لكن الجميع يسأله عن المريض",world:"grief",audience:"مرافق مريض",cta:"للمرافق حق في مساحة وصوت",scene:"يسأله الجميع صباحًا: كيف المريض؟ يجيبهم بالتفصيل، ثم يغلق الهاتف ويجلس في السيارة منهكًا. لم يسأله أحد منذ أسابيع كيف ينام هو أو ماذا يحتمل.",idea:"المرافق ليس جهازًا يعمل بجانب المريض؛ يتعب ويغضب ويخاف، وقد يشعر بالذنب إذا احتاج ساعة لنفسه. الاهتمام به لا ينتقص من ألم المريض، بل يحمي قدرته على الاستمرار. من حقه أن يكون ابنًا أو زوجًا متألمًا، لا موظف رعاية فقط.",step:"اطلب هذا الأسبوع مساعدة محددة لساعتين، واستخدم الوقت لاحتياجك أنت؛ للمرافق حق في مساحة وصوت."},
{id:26,title:"حين يدخل المرض بين الزوجين",world:"grief",audience:"زوج؛ زوجة؛ مريض؛ مرافق",cta:"احميا العلاقة من أن تصبح مرضًا فقط",scene:"منذ بدأ العلاج، صارت كل أحاديثهما عن التحاليل والأدوية والمواعيد اليومية. نسيا كيف كانا زوجين قبل المرض، وصار أحدهما مريضًا دائمًا والآخر مجرد مرافق دائمًا.",idea:"المرض يفرض حضوره، لكنه لا يجب أن يبتلع هوية العلاقة كلها. المريض قد يكره أن يُختزل في جسده، والمرافق قد يختفي خلف المسؤوليات. الحفاظ على لحظة عادية بينهما ليس إنكارًا للواقع؛ إنه تذكير مهم بأن العلاقة أوسع من الملف الطبي.",step:"خصصا عشرين دقيقة لحديث لا يتعلق بالمرض أو العلاج، واحميا العلاقة من أن تصبح مرضًا فقط."},
{id:27,title:"الإخوة لا يحزنون بالطريقة نفسها",world:"grief",audience:"إخوة؛ أسرة",cta:"لا تقيسوا صدق الحزن بطريقة ظهوره",scene:"بعد الوفاة، بكت أختهم أمام الجميع، وانشغل أخوها بالمعاملات، واختفى الثالث في عمله. بدأ كل واحد يشك أن طريقة الآخر تعني أنه لم يحب الراحل كفاية.",idea:"الحزن لا يملك شكلًا موحدًا؛ شخص يبكي، وآخر يعمل، وثالث يصمت أو يتأخر انهياره. الاختلاف قد يعكس الشخصية والدور والقدرة على الاحتمال، لا مقدار المحبة الحقيقية. مقارنة الأحزان تضيف خلافًا عائليًا جديدًا إلى خسارة تحتاج مساحة ورحمة صادقة بين الجميع.",step:"اسأل أخاك عما يحتاجه بدل تقييم طريقته، ولا تقيس صدق الحزن بسرعة ظهوره أو كمية الدموع."},
{id:28,title:"هل قال لك ابنك إنه يحبك… أو إنه يكرهك؟",world:"kids",audience:"أب؛ أم؛ ابن؛ ابنة",cta:"الخطر ليس في كلمة الغضب بل في الصمت الطويل",img:"kids_tense",scene:"هل قال لك ابنك هذا العام إنه يحبك أو يكرهك؟ ربما لم يقل شيئًا منذ سنوات؛ يدخل ويخرج ويجيب باختصار، بينما تعيشان تحت سقف واحد وبينكما مسافة لا تُرى.",idea:"كلمة «أكرهك» مؤلمة، لكنها قد تعني أن الابن ما زال يجرؤ على إظهار غضبه. الصمت الطويل أحيانًا أكثر خوفًا؛ ربما لم يتعلم التعبير، أو ظن أن كلامه سيصبح محاضرة. الأمان الحقيقي يبدأ حين يعرف أن مشاعره لن تطرده من العلاقة.",step:"احتضنه اليوم بلا استجواب ولا نصيحة، وقل إنك حاضر عندما يريد الكلام؛ راقب الصمت لا كلمة الغضب وحدها."},
{id:29,title:"الصاحب الذي يتحول إلى عدو بعد سوء فهم",world:"friendship",audience:"صديق؛ صديقة؛ عام",cta:"افهم هل كشف الخلاف عداوة قديمة أم جرحًا قابلًا للإصلاح",scene:"بدأ الخلاف برسالة فُهمت خطأ، وانتهى بصديق ينشر الأسرار ويجمع الآخرين ضد صاحبه. صار السؤال: هل صنع سوء الفهم العداوة، أم كشف ما كان مختبئًا؟",idea:"ليس كل صديق يغضب عدوًا قديمًا، فالجرح قد يدفع الإنسان إلى تصرف سيئ يمكن إصلاحه. لكن طريقة الخلاف تكشف أحيانًا حدود الوفاء: هل بقي الاحترام؟ هل استُخدمت الأسرار سلاحًا؟ الحكم يحتاج النظر إلى السلوك المتكرر لا إلى لحظة واحدة فقط.",step:"افصل الفعل المؤذي عن تفسير النيات، ثم اسأل: هل ظهر جرح قابل للإصلاح أم نمط عداوة قديم؟"},
{id:30,title:"الطلاق لم يكن فضيحة في تاريخنا… فمتى أصبح كذلك؟",world:"divorce",audience:"منفصل؛ زوج؛ زوجة؛ عام",cta:"افصل بين انتهاء العلاقة وحكم المجتمع",scene:"خرجت امرأة من زواج مؤذٍ، فصار السؤال في الحي: لماذا لم تتحمل؟ وخرج رجل من زواج منهك، فقيل إنه هدم بيته، قبل أن يسأل أحد ماذا عاشا.",idea:"الطلاق ليس اختراعًا حديثًا ولا مناسبة سعيدة، لكنه تحوّل اجتماعيًا إلى شهادة فشل تلاحق الطرفين، وبقسوة أكبر أحيانًا المرأة. انتهاء عقد لا يكشف وحده مَن أخطأ أو كم حاول كل طرف. المجتمع يرى النتيجة، بينما تبقى تفاصيل الحياة خلف الباب.",step:"عندما تسمع عن طلاق، امتنع عن سؤال اللوم الأول، وافصل بين انتهاء العلاقة وبين حكم المجتمع على أصحابها."},
{id:31,title:"ضربونا حتى شبعنا… وها نحن أصبحنا رجالًا!",world:"kids",audience:"أب؛ أم؛ مربٍ؛ ابن",cta:"العنف قد يصنع صمتًا لا رجولة",img:"kids_tense",scene:"يروي رجل كيف ضربه المعلم على يديه حتى بكى، ثم يضحك ويقول: هكذا صرنا رجالًا. بجانبه ابنه صامت، يتعلم أن الألم يصبح مقبولًا إذا نجا صاحبه.",idea:"النجاة من العنف لا تثبت أن العنف كان ضروريًا. بعض من ضُربوا صاروا أقوياء رغم الضرب، وبعضهم حمل خوفه أو كرره مع غيره. الاعتراف الصريح بالأثر لا يهين جيلًا كاملًا؛ بل يمنع تحويل المعاناة القديمة إلى منهج تربية مؤذٍ جديد.",step:"قبل معاقبة طفل، اسأل ما الذي تريد تعليمه تحديدًا، واختر وسيلة لا تصنع صمتًا ثم تسميه رجولة."},
{id:32,title:"كلما كان العرس أكبر كان الطلاق أسرع",world:"engagement",audience:"مخطوب؛ مخطوبة؛ أهل",cta:"ناقشا معنى الزواج قبل كلفة الاحتفال",scene:"دفع الأهل ثمن قاعة ضخمة وطاولات وزينة وتصوير، بينما أجّل العروسان حديث المال والسكن والعمل. انتهت ليلة مبهرة، وبدأ صباح لم يُحضَّر له إلا قليلًا.",idea:"العرس الكبير لا يسبب الطلاق وحده، ولا كل احتفال مكلف علامة خطر. المشكلة حين يصبح الإنفاق هو المشروع، ويُقاس نجاح الزواج بحجم الليلة بدل الاستعداد للحياة بعدها. الاحتفال الكبير ينتهي سريعًا، أما القرارات المؤجلة فتدخل مع الزوجين إلى البيت الجديد.",step:"قبل إضافة كلفة جديدة للحفل، خصصا جلسة لمناقشة معنى الزواج والميزانية والحياة اليومية بعد انتهاء الاحتفال."},
{id:33,title:"كل امرأة جميلة وجميلة جدًا",world:"boundaries",audience:"امرأة؛ رجل؛ عام",cta:"الجمال مساحة ترى فيها المرأة نفسها لا مسابقة القرية",scene:"قبل سنوات كانت فتيات القرية يعرفن أسماء اثنتين أو ثلاث وُصفن بالجميلات، والبقية يراقبن بصمت. اليوم تعتني كل امرأة بأسلوبها، وترى في المرآة ما لم يسمح المجتمع لها برؤيته.",idea:"الجمال ليس حكمًا نهائيًا تصدره القرية، ولا يعني أن كل الوجوه متشابهة. حين تهتم المرأة بنفسها ولباسها وحضورها، فهي لا تخدع العالم؛ إنها تستعيد حقها في رؤية أنوثتها خارج المقارنة القهرية. والثقة لا تحتاج التقليل من امرأة أخرى كي تظهر.",step:"اختاري تفصيلًا تحبينه في حضورك واعتني به لنفسك؛ اجعلي الجمال مساحة ذاتية لا مسابقة اجتماعية."},
{id:34,title:"العائلة هي منشأ أشنع الجراح",world:"kids",audience:"طفل؛ شاب؛ ابنة؛ ابن بالغ",cta:"الأبناء يظلون أبناء حتى بعد أن يكبروا ويتزوجوا",img:"kids_tense",scene:"اتصل رجل متزوج بأخته بعد إعلان طلاق والديهما وقال: أشعر أنني طفل من جديد. له بيت وأبناء، لكن البيت الأول الذي ظنه ثابتًا انقسم فجأة.",idea:"الأبناء لا يتوقفون عن كونهم أبناء حين يكبرون أو يتزوجون. طلاق الوالدين قد يعيد أسئلة قديمة عن الأمان والانتماء والذكريات، من دون أن يعني ذلك رفض حق الوالدين في القرار. الجرح يحتاج اعترافًا، لا مطالبة الابن البالغ بأن يكون عاقلًا فورًا.",step:"اسمحوا للأبناء بالتعبير من دون جعلهم حكامًا أو وسطاء؛ تذكّروا أنهم يظلون أبناء مهما بلغ عمرهم."},

}

  const menu = document.getElementById('mobileMenu');

}

// ============================= مسار الحجز =============================
const ROLES = ["زوج","زوجة","أب","أم","ابن","ابنة","مخطوب","مخطوبة","منفصل/ة","مرافق مريض","أخرى"];
let booking = {role:'', contactPref:'واتساب'};

function bookingPageHTML(){
  return `
  <section class="section wrap" style="padding-top:52px;max-width:640px;">
    <div class="eyebrow">حجز جلسة</div>
    <h1>تواصل مباشر، أسرع من أي نموذج</h1>
    <p>إذا كنت تفضّل الاتصال أو واتساب فورًا بلا تعبئة أي شيء، هذا أسرع طريق:</p>

    <div style="display:grid;gap:12px;grid-template-columns:1fr 1fr;margin:22px 0 8px;">
      <a href="tel:${PHONE_LOCAL}" class="btn btn-primary" style="padding:16px 10px;font-size:1rem;">📞 اتصل الآن</a>
      <a href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent('مرحبًا عماد، أرغب بحجز جلسة.')}" target="_blank" rel="noopener" class="btn" style="padding:16px 10px;font-size:1rem;background:#25D366;color:#fff;">💬 واتساب مباشر</a>
    </div>
    <p class="disclaimer" style="margin-top:0;">${PHONE_LOCAL} — متاح خلال ساعات العمل، والرد على واتساب عادة أسرع.</p>

    <div class="hairline"></div>

    <div class="eyebrow">أو اترك التفاصيل الآن ويتواصل معك عماد</div>
    <p style="margin-top:-6px;">لا حاجة لخطوات متعددة — املأ ما تريد وأرسل.</p>

    <div class="form-field">
      <fieldset style="border:0;padding:0;margin:0;">
        <legend style="font-size:.9rem;margin-bottom:7px;font-weight:600;">ما دورك في القصة؟ (اختياري)</legend>
        <div class="option-grid">
          ${ROLES.map(r=>`<div class="opt role-opt" onclick="pickRole(this,'${r}')">${r}</div>`).join('')}
        </div>
      </fieldset>
    </div>

    <div class="form-field">
      <label for="f-topic">ما الموضوع؟</label>
      <textarea id="f-topic" placeholder="مثال: صمت متكرر بيننا منذ فترة، أو خلاف مع ابننا المراهق..."></textarea>
    </div>
    <div class="form-field">
      <label for="f-attendees">من سيحضر الجلسة؟</label>
      <input id="f-attendees" type="text" placeholder="مثال: أنا وزوجتي، أو أنا فقط">
    </div>
    <div class="form-field">
      <label for="f-name">الاسم</label>
      <input id="f-name" type="text">
    </div>
    <div class="form-field">
      <label for="f-phone">رقم الهاتف</label>
      <input id="f-phone" type="tel">
    </div>
    <div class="form-field">
      <label>طريقة التواصل المفضلة</label>
      <div class="option-grid" style="grid-template-columns:repeat(3,1fr);">
        ${["واتساب","اتصال هاتفي","بريد إلكتروني"].map(o=>`<div class="opt pref-opt ${booking.contactPref===o?'sel':''}" onclick="pickContactPref(this,'${o}')">${o}</div>`).join('')}
      </div>
    </div>
    <div class="form-field">
      <label for="f-time">الوقت الملائم (اختياري)</label>
      <input id="f-time" type="text" placeholder="مثال: مساءً بعد الساعة السابعة">
    </div>
    <div class="form-field">
      <label for="f-note">ملاحظة (اختياري)</label>
      <textarea id="f-note" placeholder="أي شيء تريد أن يعرفه عماد قبل التواصل"></textarea>
    </div>

    <button class="btn btn-primary" style="width:100%;padding:14px;" onclick="submitBooking()">أرسل التفاصيل عبر واتساب</button>
    <p class="disclaimer">الإرسال يفتح واتساب على جهازك برسالة جاهزة لمراجعتها قبل الإرسال — هذا طلب تواصل وليس تأكيدًا تلقائيًا للموعد.</p>
  </section>`;
}

function pickRole(el, r){
  booking.role = r;
  document.querySelectorAll('.role-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
}
function pickContactPref(el, o){
  booking.contactPref = o;
  document.querySelectorAll('.pref-opt').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
}

function submitBooking(){
  const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const topic = val('f-topic'), attendees = val('f-attendees'), name = val('f-name'),
        phone = val('f-phone'), time = val('f-time'), note = val('f-note');
  const lines = [
    `مرحبًا عماد، أرغب في حجز جلسة.`,
    booking.role ? `دوري في القصة: ${booking.role}` : null,
    topic ? `الموضوع: ${topic}` : null,
    attendees ? `من سيحضر الجلسة: ${attendees}` : null,
    name ? `الاسم: ${name}` : null,
    phone ? `الهاتف: ${phone}` : null,
    `طريقة التواصل المفضلة: ${booking.contactPref}`,
    time ? `الوقت الملائم: ${time}` : null,
    note ? `ملاحظة: ${note}` : null,
  ].filter(Boolean).join('\n');
  const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(lines)}`;
  window.open(url, '_blank', 'noopener');
}

// ============================= الموجّه (Router) =============================
function routeTitle(hash){
  if(hash.startsWith('#/world/')) { const w = worldBySlug(hash.split('/')[2]); return w ? w.title : 'عالم'; }
  if(hash.startsWith('#/article/')) { const a = articleById(hash.split('/')[2]); return a ? a.title : 'مقال'; }
  if(hash==='#/worlds') return 'ما الذي يشغلك اليوم؟';
  if(hash==='#/library') return 'مكتبة المقالات';
  if(hash==='#/about') return 'عن عماد';
  if(hash==='#/booking') return 'احجز جلسة';
  if(hash==='#/sanad') return 'قصة SANAD';
  if(hash==='#/contact') return 'تواصل';
  if(hash==='#/privacy') return 'الخصوصية';
  return 'الرئيسية';
}

function router(){
  const hash = location.hash || '#/';
  let content = '';
  if(hash==='#/' || hash===''){ content = homePageHTML(); }
  else if(hash.startsWith('#/world/')){ content = worldPageHTML(hash.split('/')[2]); }
  else if(hash.startsWith('#/article/')){ content = articlePageHTML(hash.split('/')[2]); }
  else if(hash==='#/worlds'){ content = worldsIndexPageHTML(); }
  else if(hash==='#/library'){ libraryFilter='all'; content = libraryPageHTML(); }
  else if(hash==='#/about'){ content = aboutPageHTML(); }
  else if(hash==='#/booking'){ booking = {role:'', contactPref:'واتساب'}; content = bookingPageHTML(); }
  else if(hash==='#/sanad'){ content = sanadPageHTML(); }
  else if(hash==='#/contact'){ content = contactPageHTML(); }
  else if(hash==='#/privacy'){ content = privacyPageHTML(); }
  else { content = notFoundHTML(); }

  document.getElementById('app').innerHTML = `<div class="page-fade">${content}</div>`;
  document.title = routeTitle(hash) + ' — عماد أبو يونس';
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
  closeMobileMenu();
}

function renderShell(){
  document.getElementById('header-slot').innerHTML = headerHTML(location.hash || '#/');
  document.getElementById('footer-slot').innerHTML = footerHTML();
}

window.addEventListener('hashchange', () => { renderShell(); router(); });
window.addEventListener('DOMContentLoaded', () => { renderShell(); router(); });

</script>
