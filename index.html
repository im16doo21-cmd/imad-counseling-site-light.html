<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عماد أبو يونس — مستشار أسري وزوجي</title>
<meta name="description" content="كل بيت عالم. وكل إنسان يرى الحكاية من باب مختلف.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F2EADA;
  --ivory-2:#FAF5E9;
  --charcoal:#2A241C;
  --charcoal-soft:#5D5340;
  --olive:#4B5236;
  --olive-deep:#343A25;
  --burgundy:#7C2E2A;
  --burgundy-deep:#5E211E;
  --gold:#B48A46;
  --gold-soft:#D9BA85;
  --line:rgba(42,36,28,0.14);
  --shadow:0 10px 30px rgba(42,36,28,0.12);
  color-scheme: light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ivory:#211C15;
    --ivory-2:#2A241B;
    --charcoal:#EFE6D4;
    --charcoal-soft:#C7BBA1;
    --line:rgba(239,230,212,0.16);
    --shadow:0 10px 30px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ivory:#211C15;
  --ivory-2:#2A241B;
  --charcoal:#EFE6D4;
  --charcoal-soft:#C7BBA1;
  --line:rgba(239,230,212,0.16);
  --shadow:0 10px 30px rgba(0,0,0,0.4);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--ivory);
  color:var(--charcoal);
  font-family:'IBM Plex Sans Arabic','Tahoma',sans-serif;
  direction:rtl;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px;}
h1,h2,h3,h4{
  font-family:'Noto Kufi Arabic','Tahoma',sans-serif;
  margin:0 0 .4em;
  font-weight:700;
  color:var(--charcoal);
  line-height:1.35;
}
p{margin:0 0 1em;color:var(--charcoal-soft);}
.eyebrow{
  font-size:.82rem;
  color:var(--burgundy);
  font-weight:600;
  margin:0 0 .5em;
}
:root[data-theme="dark"] .eyebrow, :root:not([data-theme="light"]) .eyebrow{ color:var(--gold-soft); }
.hairline{height:1px;background:var(--line);border:0;margin:48px 0;}

/* focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--burgundy);
  outline-offset:3px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

/* ---------- header ---------- */
.site-header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--ivory) 92%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.site-header .row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1120px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-name{font-family:'Noto Kufi Arabic',sans-serif;font-weight:700;font-size:1.25rem;}
.brand-title{font-size:.72rem;color:var(--charcoal-soft);display:block;margin-top:-2px;}
.nav-desktop{display:none;gap:26px;align-items:center;}
.nav-desktop a{font-size:.95rem;color:var(--charcoal-soft);white-space:nowrap;}
.nav-desktop a.active, .nav-desktop a:hover{color:var(--burgundy);}
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:11px 22px;border-radius:999px;font-size:.92rem;font-weight:600;
  border:1px solid transparent;cursor:pointer;
}
.btn-primary{background:var(--burgundy);color:#fff;}
.btn-primary:hover{background:var(--burgundy-deep);}
.btn-ghost{background:transparent;border-color:var(--charcoal);color:var(--charcoal);}
.btn-ghost:hover{border-color:var(--burgundy);color:var(--burgundy);}
.btn-outline-inv{background:transparent;border-color:#fff;color:#fff;}
.menu-toggle{
  display:inline-flex;background:transparent;border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;color:var(--charcoal);
}
.mobile-menu{
  display:none;flex-direction:column;gap:2px;
  border-top:1px solid var(--line);background:var(--ivory);
}
.mobile-menu.open{display:flex;}
.mobile-menu a{padding:14px 20px;border-bottom:1px solid var(--line);font-size:1rem;}
.mobile-menu .btn{margin:14px 20px;}
@media(min-width:860px){
  .nav-desktop{display:flex;}
  .menu-toggle{display:none;}
}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg, var(--ivory-2), var(--ivory));
}
.hero .wrap{
  display:grid;gap:28px;align-items:center;
  padding:44px 20px 56px;
}
@media(min-width:900px){
  .hero .wrap{grid-template-columns:1.1fr .9fr;padding:72px 20px 84px;}
}
.hero-kicker{font-size:.85rem;color:var(--burgundy);font-weight:600;margin-bottom:14px;}
.hero h1{font-size:clamp(1.9rem,5.4vw,3rem);}
.hero .motto{font-size:1.05rem;color:var(--charcoal-soft);max-width:44ch;margin-bottom:26px;}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;}
.hero-figure{
  position:relative;border-radius:200px 200px 24px 24px;overflow:hidden;
  aspect-ratio:4/5;box-shadow:var(--shadow);border:1px solid var(--line);
}
.hero-figure img{width:100%;height:100%;object-fit:cover;}

/* ---------- today bar (doors) ---------- */
.today-bar{padding:40px 0 8px;}
.today-bar .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.doors-scroll{
  display:flex;gap:16px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x proximity;
  -ms-overflow-style:none;scrollbar-width:thin;
}
.door-card{
  scroll-snap-align:start;flex:0 0 148px;text-align:center;
}
.door-shape{
  width:148px;height:190px;border-radius:74px 74px 16px 16px;
  overflow:hidden;position:relative;border:1px solid var(--line);
  box-shadow:0 6px 18px rgba(42,36,28,0.10);
  transition:transform .2s ease, box-shadow .2s ease;
}
.door-card:hover .door-shape{transform:translateY(-4px);box-shadow:0 14px 26px rgba(42,36,28,0.18);}
.door-shape img{width:100%;height:100%;object-fit:cover;}
.door-shape::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(42,36,28,0) 45%, rgba(20,17,12,.72) 100%);
}
.door-label{
  position:absolute;bottom:10px;right:0;left:0;color:#fff;font-size:.86rem;font-weight:600;
  padding:0 10px;z-index:2;line-height:1.3;
}
.door-card .cap{margin-top:10px;font-size:.8rem;color:var(--charcoal-soft);}

/* ---------- grids & cards ---------- */
.section{padding:40px 0;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.section-head p{margin:6px 0 0;max-width:56ch;}
.link-more{font-size:.9rem;color:var(--burgundy);font-weight:600;white-space:nowrap;}
.link-more:hover{text-decoration:underline;}

.grid-articles{display:grid;gap:20px;grid-template-columns:1fr;}
@media(min-width:640px){.grid-articles{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.grid-articles{grid-template-columns:repeat(3,1fr);}}

.card-article{
  background:var(--ivory-2);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;height:100%;
}
.card-article .swatch{
  height:8px;
}
.card-article .world-thumb{aspect-ratio:4/3;overflow:hidden;background:var(--line);}
.card-article .world-thumb img{width:100%;height:100%;object-fit:cover;}
.card-article .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card-article .tag{font-size:.72rem;color:var(--olive);font-weight:600;}
:root[data-theme="dark"] .card-article .tag, :root:not([data-theme="light"]) .card-article .tag{color:var(--gold-soft);}
.card-article h3{font-size:1.08rem;margin:0;}
.card-article .cta{font-size:.86rem;color:var(--charcoal-soft);margin-top:auto;padding-top:6px;}
.card-article .demo-flag{font-size:.68rem;color:var(--burgundy);border:1px solid var(--burgundy);border-radius:6px;padding:1px 6px;display:inline-block;width:fit-content;}

.feature{
  display:grid;gap:24px;background:var(--ivory-2);border:1px solid var(--line);border-radius:22px;overflow:hidden;
}
@media(min-width:820px){.feature{grid-template-columns:1fr 1fr;align-items:stretch;}}
.feature .img-side{min-height:220px;}
.feature .img-side img{width:100%;height:100%;object-fit:cover;}
.feature .txt-side{padding:28px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px;}

/* two rich paths */
.paths-two{display:grid;gap:24px;}
@media(min-width:820px){.paths-two{grid-template-columns:1fr 1fr;}}
.path-block{border:1px solid var(--line);border-radius:20px;padding:24px;background:var(--ivory-2);}
.path-block .mini-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.path-block .mini-list li{font-size:.92rem;padding-right:16px;position:relative;color:var(--charcoal-soft);}
.path-block .mini-list li::before{content:"—";position:absolute;right:0;color:var(--gold);}

/* imagine this scene */
.scene-block{
  border-radius:22px;padding:34px 28px;background:var(--olive-deep);color:var(--ivory-2);
  position:relative;
}
.scene-block h2{color:var(--ivory-2);}
.scene-block p{color:rgba(250,245,233,.85);font-size:1.05rem;max-width:66ch;}

/* video strip */
.video-strip{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 14px;-webkit-overflow-scrolling:touch;}
.video-card{flex:0 0 220px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--charcoal);}
.video-card video{width:220px;max-height:340px;display:block;background:#000;object-fit:contain;}
.video-card .cap{padding:10px 12px;font-size:.86rem;background:var(--ivory-2);color:var(--charcoal);}

.trust-grid{display:grid;gap:18px;}

/* quote strip — appears on every page */
.quote-strip{background:var(--olive-deep);padding:26px 0;}
.quote-strip .wrap{display:flex;align-items:flex-start;gap:10px;max-width:760px;}
.quote-strip .qmark{font-family:'Noto Kufi Arabic',sans-serif;font-size:2rem;line-height:1;color:var(--gold-soft);flex:0 0 auto;}
.quote-strip p{margin:0;color:var(--ivory-2);font-size:1.05rem;line-height:1.8;flex:1;}
.quote-strip .qmore{flex:0 0 auto;color:var(--gold-soft);font-size:.82rem;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:4px;opacity:.85;}
.quote-strip .qmore:hover{opacity:1;text-decoration:underline;}
@media(min-width:760px){.trust-grid{grid-template-columns:1fr 1fr;}}
.trust-card{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--ivory-2);}
.trust-card h3{font-size:1.05rem;}
.trust-card ul{margin:0;padding-inline-start:20px;color:var(--charcoal-soft);}
.trust-card li{margin-bottom:8px;}

/* faq */
.faq-item{border-bottom:1px solid var(--line);padding:18px 0;}
.faq-item summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item summary .ic{color:var(--gold);}
.faq-item[open] summary .ic{transform:rotate(45deg);}
.faq-item p{margin-top:12px;}

/* sanad */
.sanad-box{display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);border-radius:20px;padding:26px;background:var(--ivory-2);}
@media(min-width:760px){.sanad-box{flex-direction:row;align-items:center;}}
.sanad-logo{
  width:56px;height:56px;border-radius:14px;background:var(--burgundy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Noto Kufi Arabic',sans-serif;font-size:1.3rem;flex:0 0 auto;
}

/* final cta */
.final-cta{
  border-radius:24px;padding:40px 28px;text-align:center;
  background:radial-gradient(circle at 30% 20%, var(--burgundy-deep), var(--charcoal) 120%);
  color:#fff;
}
.final-cta h2{color:#fff;}
.final-cta p{color:rgba(255,255,255,.8);max-width:52ch;margin-inline:auto;}

/* footer */
.site-footer{border-top:1px solid var(--line);padding:44px 0 30px;margin-top:20px;background:var(--ivory-2);}
.footer-grid{display:grid;gap:28px;}
@media(min-width:760px){.footer-grid{grid-template-columns:1.3fr 1fr 1fr;}}
.footer-grid h4{font-size:.95rem;}
.footer-grid ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.footer-grid a{color:var(--charcoal-soft);font-size:.9rem;}
.footer-grid a:hover{color:var(--burgundy);}
.footer-bottom{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:.8rem;color:var(--charcoal-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

/* ---------- world page ---------- */
.world-hero{position:relative;min-height:280px;display:flex;align-items:flex-end;overflow:hidden;}
.world-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.world-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,17,12,.15), rgba(20,17,12,.82));}
.world-hero .in{position:relative;z-index:2;color:#fff;padding:60px 20px 34px;width:100%;}
.world-hero h1{color:#fff;font-size:clamp(1.8rem,5vw,2.6rem);}
.world-hero .q{color:rgba(255,255,255,.85);font-size:1.05rem;max-width:50ch;}
.crumb{font-size:.82rem;color:rgba(255,255,255,.75);margin-bottom:10px;display:block;}
.crumb a{text-decoration:underline;}

.subcase-grid{display:grid;gap:16px;grid-template-columns:1fr;}
@media(min-width:640px){.subcase-grid{grid-template-columns:1fr 1fr;}}
.subcase-card{border:1px solid var(--line);background:var(--ivory-2);border-radius:16px;padding:18px 20px;}
.subcase-card h3{font-size:1rem;margin-bottom:6px;}
.subcase-card p{font-size:.9rem;margin:0;}

.related-worlds{display:flex;gap:12px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.86rem;
  background:var(--ivory-2);
}
.chip:hover{border-color:var(--burgundy);color:var(--burgundy);}

/* ---------- article page ---------- */
.article-head{padding:52px 0 20px;}
.article-head .eyebrow{margin-bottom:10px;}
.article-head h1{font-size:clamp(1.7rem,4.6vw,2.4rem);max-width:26ch;}
.byline{display:flex;align-items:center;gap:12px;margin-top:20px;}
.byline img{width:46px;height:46px;border-radius:50%;object-fit:cover;}
.byline .n{font-weight:600;font-size:.92rem;}
.byline .r{font-size:.8rem;color:var(--charcoal-soft);}
.article-body{max-width:70ch;font-size:1.05rem;}
.article-body h2{font-size:1.3rem;margin-top:1.4em;}
.article-body p{color:var(--charcoal);}
.pull-cta{
  border-right:3px solid var(--gold);padding:6px 18px;margin:28px 0;color:var(--charcoal-soft);font-style:italic;
}
.demo-note{
  background:var(--ivory-2);border:1px dashed var(--line);border-radius:12px;padding:14px 18px;font-size:.85rem;color:var(--charcoal-soft);margin-bottom:24px;
}

/* ---------- library ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
.filter-btn{
  border:1px solid var(--line);background:var(--ivory-2);border-radius:999px;
  padding:8px 16px;font-size:.86rem;cursor:pointer;color:var(--charcoal-soft);
}
.filter-btn.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}

/* ---------- about ---------- */
.about-hero{display:grid;gap:28px;align-items:center;}
@media(min-width:860px){.about-hero{grid-template-columns:.9fr 1.1fr;}}
.about-hero .ph{border-radius:24px;overflow:hidden;aspect-ratio:4/5;border:1px solid var(--line);box-shadow:var(--shadow);}
.about-hero .ph img{width:100%;height:100%;object-fit:cover;}
.creds{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:18px;}
.creds .c{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--ivory-2);font-size:.86rem;}
.creds .c b{display:block;font-size:.78rem;color:var(--olive);margin-bottom:4px;}
:root[data-theme="dark"] .creds .c b, :root:not([data-theme="light"]) .creds .c b{color:var(--gold-soft);}

/* ---------- booking ---------- */
.option-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;}
@media(min-width:600px){.option-grid{grid-template-columns:repeat(3,1fr);}}
.opt{
  border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;
  background:var(--ivory-2);font-size:.92rem;
}
.opt.sel{border-color:var(--burgundy);color:var(--burgundy);background:color-mix(in srgb, var(--burgundy) 8%, var(--ivory-2));}
.form-field{margin-bottom:18px;}
.form-field label{display:block;font-size:.9rem;margin-bottom:7px;font-weight:600;}
.form-field input, .form-field textarea{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--ivory-2);color:var(--charcoal);font-family:inherit;font-size:.95rem;
}
.form-field textarea{min-height:90px;resize:vertical;}
.disclaimer{font-size:.8rem;color:var(--charcoal-soft);margin-top:16px;}

/* ai assistant strip */
.ai-strip{
  border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:var(--ivory-2);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.ai-strip .txt{flex:1;min-width:220px;}
.ai-strip .warn{font-size:.78rem;color:var(--burgundy);margin-top:4px;}

.page-fade{animation:pf .35s ease both;}
@keyframes pf{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}



/* إضافات النسخة 8 */
.library-search{width:100%;max-width:720px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--ivory-2);color:var(--charcoal);font:inherit;margin:18px 0 12px;}
.quick-topics{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
.quick-topic{border:1px solid var(--line);background:transparent;color:var(--charcoal-soft);border-radius:999px;padding:7px 12px;font:inherit;cursor:pointer;}
.quick-topic:hover{border-color:var(--burgundy);color:var(--burgundy);}
.search-status{font-size:.86rem;color:var(--charcoal-soft);margin:8px 0 18px;}
.start-grid{display:grid;gap:16px;margin-top:24px;}
.start-card{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--ivory-2);}
.start-card label{display:block;font-weight:700;margin-bottom:8px;}
.start-card select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--ivory);color:var(--charcoal);font:inherit;}
.start-result{margin-top:22px;padding:22px;border-radius:18px;background:var(--olive-deep);color:#fff;display:none;}
.start-result h2,.start-result p{color:#fff;}
.floating-whatsapp{position:fixed;z-index:60;left:18px;bottom:18px;display:flex;align-items:center;gap:8px;background:#187d47;color:#fff;padding:12px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.22);font-weight:700;}
.floating-whatsapp:hover{background:#12683a;color:#fff;}
.article-label{font-family:'Noto Kufi Arabic',sans-serif;font-size:.82rem;color:var(--burgundy);font-weight:700;margin-bottom:6px;}
.knowledge-lens{margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--ivory-2),rgba(188,154,86,.08));position:relative;overflow:hidden;}
.knowledge-lens:before{content:'';position:absolute;inset-inline-start:0;top:0;width:4px;height:100%;background:var(--gold);}
.knowledge-lens .lens-kind{font-family:'Noto Kufi Arabic',sans-serif;font-size:.76rem;color:var(--olive);font-weight:700;letter-spacing:.02em;}
.knowledge-lens h3{margin:7px 0 9px;font-size:1.08rem;}
.knowledge-lens p{margin:0;color:var(--charcoal-soft);font-size:.94rem;}
.thought-bridge{margin-top:18px;padding:18px 20px;border-right:3px solid var(--burgundy);background:rgba(116,42,54,.045);border-radius:12px;}
.thought-bridge p{margin:4px 0 0;font-size:1rem;}
.reading-progress{position:fixed;z-index:120;top:0;right:0;height:3px;width:0;background:linear-gradient(90deg,var(--burgundy),var(--gold));transition:width .12s linear;pointer-events:none;}
.card-article,.door-card,.world-card,.start-card,.trust-card{transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;}
.card-article:hover,.door-card:hover,.world-card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(48,39,30,.09);}
::view-transition-old(root){animation:page-out .18s ease both;}::view-transition-new(root){animation:page-in .32s ease both;}
@keyframes page-out{to{opacity:0;transform:translateY(-5px)}}@keyframes page-in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}.card-article:hover,.door-card:hover,.world-card:hover{transform:none;}}
@media(min-width:760px){.start-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:520px){.floating-whatsapp{left:12px;bottom:12px;padding:11px 13px;font-size:.9rem;}.hero h1{font-size:1.85rem;}}
</style>

const ARTICLES = [
{id:1,title:"ما الذي جعل جيلًا كاملًا يقول: فِش عروس؟",world:"engagement",audience:"شاب؛ شابة؛ أهل",cta:"اختبر إن كانت المشكلة في الخيارات أم في الدائرة",scene:"يجلس شاب مع أهله مساء الجمعة، وكلما ذُكر الزواج قالوا إن البنات لا يناسبنه. وفي بيت آخر تقول شابة الكلام نفسه عن الشباب، ثم يعود كلٌّ منهما إلى الدائرة ذاتها.",idea:"عبارة «فِش عروس» لا تعني دائمًا غياب الراغبين في الزواج. قد تكشف دائرة اجتماعية مغلقة، أو شروطًا متناقضة، أو خوفًا يجعل كل فرصة تبدو ناقصة. الشاب والفتاة قد يريدان الارتباط فعلًا، لكنهما يبحثان بالطريقة نفسها ويتوقعان نتيجة مختلفة في النهاية.",step:"اكتب ثلاثة شروط ضرورية وثلاثة يمكن التفاوض حولها، ثم اختبر إن كانت المشكلة في الخيارات أم في دائرتك."},
{id:2,title:"ماذا يعني زواج ناجح؟ ولمن هو ناجح؟",world:"marriage",audience:"زوج؛ زوجة",cta:"إذا اختلف تعريف النجاح بينكما فالجلسة تساعدكما على تسميته",scene:"يصف الزوج نجاح الزواج بأنه بيت مستقر وأطفال بخير، بينما تراه الزوجة علاقة فيها قرب وحديث واهتمام. كلاهما يظن أنه يؤدي المطلوب، وكلاهما يشعر أن الآخر لا يراه.",idea:"قد يبدو الزواج ناجحًا أمام العائلة والجيران، لكنه لا يحمل المعنى نفسه لمن يعيش داخله. لا يوجد تعريف واحد يناسب الجميع؛ المشكلة تبدأ حين يتحول تعريف طرف واحد إلى القانون الوحيد. النجاح يحتاج معنى مشتركًا يضم الأمان والاحترام والمسؤولية وما يحتاجه كل شريك.",step:"اكتب كل منكما ثلاث علامات لزواج ناجح، ثم قارنا القائمتين وسمّيا نقطة الاختلاف الأهم بينكما."},
{id:3,title:"كيف يصبح الرجل الذي تزوّجته عن حب… رجلًا لا يُطاق؟",world:"marriage",audience:"زوجة؛ زوج",cta:"افهما التحول قبل أن تحكما على النهاية",scene:"كانت تنتظر رسائله حتى منتصف الليل، واليوم تضيق من صوت مفتاحه في الباب. وهو أيضًا لم يعد يفهم كيف تحولت المرأة التي أحبته إلى شخص يتوقع منه الخطأ قبل الكلام.",idea:"لا يتحول الإنسان عادة في يوم واحد؛ تتراكم خيبات صغيرة، وضغوط، وأدوار لم تُناقش، وصور مثالية لا يحتملها الواقع. قد يتغير الرجل، وقد تتغير المرأة، وقد تتغير الطريقة التي ينظر بها كل واحد إلى الآخر. فهم المسار لا يبرر الأذى، لكنه يمنع اختزال سنوات في صفة واحدة.",step:"اختارا تغيرًا واحدًا لاحظتماه وحددا متى بدأ وما الذي سبقه، قبل أن تحكما على نهاية العلاقة."},
{id:4,title:"الأم المسيطرة داخل البيت والزوج الهادئ وفقدان الأبناء",world:"kids",audience:"أب؛ أم",cta:"أعيدوا توزيع الأدوار قبل أن يصبح الطفل ساحة الصراع",img:"kids_tense",scene:"عندما يطلب الابن شيئًا ينظر إلى أمه أولًا، وحين يعترض الأب تتدخل فتُنهي النقاش. بمرور الوقت صار الأب حاضرًا في البيت، لكنه خارج كل قرار حقيقي.",idea:"السيطرة لا تحتاج صراخًا دائمًا، والهدوء لا يعني موافقة أو حكمة دائمًا. حين يحتكر أحد الوالدين القرار وينسحب الآخر، يتعلم الأبناء الالتفاف بينهما بدل احترامهما. المسؤولية هنا مشتركة: طرف يحتاج أن يخفف قبضته، وطرف يحتاج أن يستعيد صوته من دون حرب.",step:"اتفقا هذا الأسبوع على قرار واحد يخص الأبناء، وناقشاه منفردين قبل إعلانه بصوت والدين متفقين."},
{id:5,title:"إذا لم يكن لك مقعد على الطاولة فأنت على قائمة الطعام",world:"boundaries",audience:"عام",cta:"سمِّ حدودك قبل أن تُستهلك",scene:"كانوا يتخذون القرارات في الجلسة نفسها، ثم يطلبون منه التنفيذ بعد انتهائها. كلما اعترض قالوا إنه حساس، وكلما وافق شعر أنه يتحول من شريك إلى أداة.",idea:"المقعد على الطاولة ليس كرسيًا، بل حق في المعرفة والتأثير والرفض. من يُستدعى فقط عندما يحتاجه الآخرون قد يكون جزءًا من الخطة لا شريكًا فيها. وضع الحدود لا يعني الخصومة؛ يعني أن يعرف الناس أين ينتهي تعاونك وأين يبدأ استهلاكك.",step:"اختر موقفًا واحدًا يتكرر، وقل بوضوح ما ستقبله وما لن تفعله بعد اليوم، من دون تهديد."},
{id:6,title:"حين تصبح غرفة في البيت زنزانة لطفل",world:"kids",audience:"أب؛ أم؛ ابن؛ ابنة",cta:"افتحوا باب الحوار قبل باب الغرفة",img:"kids_tense",scene:"يعود الطفل من المدرسة، يغلق باب غرفته، ويقضي ساعات بين الهاتف والسقف. يظن الأهل أنه يحب العزلة، بينما صار الباب المغلق طريقته الوحيدة كي لا يُسأل ولا يُنتقد.",idea:"الغرفة قد تكون مساحة خصوصية صحية، وقد تصبح زنزانة حين يشعر الطفل أن الخروج منها يعني محاضرة أو مقارنة أو شجارًا. اقتحام الباب يزيد الحصار، وتجاهل ما يحدث يتركه وحده. المطلوب علاقة تجعل البيت مكانًا يمكن الظهور فيه بلا خوف.",step:"اطرق الباب اليوم، وادخل بلا أسئلة كثيرة؛ اجلس عشر دقائق لشيء يحبه، ثم افتح باب الحوار."},
{id:7,title:"حين يصبح الزواج: أنت فعلت… وأنا سأفعل",world:"marriage",audience:"زوج؛ زوجة",cta:"أوقفا دفتر الحساب قبل أن يبتلع العلاقة",scene:"تأخر مرة، فتأخرت في الرد عليه عمدًا. انتقدها أمام أهله، فذكّرته بخطئه أمام أصدقائه. لم يعد الخلاف عن المشكلة الأولى، بل عن مَن يوجع الآخر أكثر.",idea:"حين يصبح الزواج ردود أفعال انتقامية، يتحول الألم إلى عملة يدفع بها الطرفان. كل واحد يملك سببًا مفهومًا لغضبه، لكن تبرير الضربة بضربة أخرى يبني دفتر حساب لا علاقة. العدالة بين الزوجين ليست تساوي الأذى، بل توقفه ومناقشة أصله تمامًا.",step:"أوقفا ردًا انتقاميًا واحدًا هذا الأسبوع، وتحدثا عن الجرح الأول بدل إضافة بند جديد إلى الحساب."},
{id:8,title:"الزواج لا ينجح وحده… ويُتعب من يحمله وحده",world:"marriage",audience:"زوج؛ زوجة",cta:"إذا كان واحد يحمل الزواج وحده فهذه إشارة للجلسة",scene:"هي ترتب المواعيد والبيت والأطفال وتبدأ كل حديث صعب، أو هو يعمل ويصالح ويتنازل وحده. الطرف الآخر موجود، لكن العلاقة تتحرك بجهد شخص واحد فقط.",idea:"يمكن لشخص أن يحمل الزواج فترة، لكنه لا يستطيع أن يحمله إلى الأبد. التعب لا يثبت دائمًا أن الطرف الآخر سيئ؛ أحيانًا لم تُسمَّ المسؤوليات، أو صار العطاء عادة غير مرئية. المشكلة تبدأ حين يُطلب من المتعب أن يبذل أكثر كي لا يسقط كل شيء.",step:"اكتبا مسؤوليات العلاقة كما هي اليوم، ثم انقلا مهمة واحدة كاملة من الطرف المُنهك إلى الطرف الآخر."},
{id:9,title:"الطلاق الذي يحدث قبل أن يذهب أحد إلى المحكمة",world:"divorce",audience:"زوج؛ زوجة؛ منفصل",cta:"افهما هل انتهت العلاقة أم انقطع الكلام فقط",scene:"ما زالا يعيشان في البيت نفسه، لكنهما لا يتحدثان إلا عن الفواتير والأطفال. لا شجار كبيرًا بينهما، فقط حياة مرتبة يتصرف فيها كل واحد كأن الآخر غير موجود.",idea:"قد يبدأ الطلاق قبل الأوراق حين ينقطع الفضول واللمس والكلام، ويصبح وجود الشريك تفصيلًا إداريًا. لكن الصمت وحده لا يثبت أن العلاقة انتهت؛ قد يكون انسحابًا من ألم لم يعرفا كيف يناقشانه. التمييز بين النهاية والانقطاع يحتاج صدقًا لا افتراضًا.",step:"خصصا نصف ساعة بلا هواتف واسألا سؤالًا واحدًا: هل انتهت العلاقة فعلًا، أم انقطع الكلام بيننا؟"},
{id:10,title:"عمر الزهرة قصير… والحب المجنون أيضًا",world:"engagement",audience:"مخطوب؛ مخطوبة",cta:"ابنيا ما يبقى بعد هدوء الاندفاع",scene:"في الأشهر الأولى كانا يتركان أعمالهما ليلتقيا، ويتحدثان حتى الفجر. بعد أن هدأ الاندفاع، خاف كل واحد منهما أن يكون هدوء العلاقة دليلًا على موت الحب.",idea:"الحب المشتعل جميل، لكنه لا يبقى بالقوة نفسها؛ الجسد والوقت والحياة يعيدون الإيقاع إلى طبيعته. الهدوء ليس خيانة للبداية، وقد يكون أول فرصة لرؤية الإنسان الحقيقي خلف الانبهار. ما يبقى يحتاج توافقًا وعناية وقدرة على احتمال الأيام العادية معًا فعلًا.",step:"اختارا عادة أسبوعية صغيرة تستطيعان الاستمرار بها بعد هدوء الاندفاع، واجعلاها جزءًا ثابتًا من علاقتكما."},
{id:11,title:"الخِطبة ليست بروفة لحفل الزفاف",world:"engagement",audience:"مخطوب؛ مخطوبة؛ أهل",cta:"اسألا الأسئلة التي لا يجيب عنها الحفل",scene:"أمضيا الخطبة في اختيار القاعة والأثاث والتصوير، وكلما ظهر اختلاف بينهما قالا: نحلّه بعد الزواج. جاء الحفل كاملًا، ودخلت الأسئلة المؤجلة معهما إلى البيت الجديد.",idea:"الخطبة ليست وقت انتظار بين الطلب والعرس، بل مساحة لاختبار طريقة التفكير والاختلاف. لا تكشف الحفلات الموقف من المال والأهل والعمل والأطفال والخصوصية. التوافق لا يعني إجابات متطابقة، بل قدرة مشتركة على مناقشة الفروق قبل أن تصبح التزامات يومية ثقيلة.",step:"أوقفا حديث التحضيرات لساعة، واسألا بعضكما ثلاثة أسئلة صعبة لا يجيب عنها الحفل ولا تؤجل إلى الزواج."},
{id:12,title:"الفجوة بين الشاب والفتاة: الجميع يريد الزواج ولا أحد يصل",world:"engagement",audience:"شاب؛ شابة",cta:"افهما أين تتعطل الطريق",scene:"يقول الشاب إنه يبحث بجد، وتقول الشابة إنها جاهزة للزواج، لكن لقاءاتهما تنتهي سريعًا. كل طرف يدخل محمّلًا بصورة عن الآخر قبل أن يسمع منه جملة كاملة.",idea:"الفجوة ليست نقصًا في الرغبة فقط؛ قد تكون اختلافًا في التوقعات واللغة والواقع الاقتصادي ومعنى الشراكة. حين يبحث كل طرف عن نسخة تؤكد أفكاره، يصبح اللقاء امتحانًا لا تعارفًا. الوصول الحقيقي يبدأ بفهم ما يعطّل الطريق لا باتهام جيل كامل.",step:"بعد اللقاء المقبل، اكتب ما سمعته فعلًا وما افترضته، ثم حدّد أين تعطلت الطريق بينكما."},
{id:13,title:"لن تجد عروسًا وأنت تعيش في الدائرة نفسها كل يوم",world:"engagement",audience:"شاب",cta:"وسّع حياتك قبل قائمة شروطك",scene:"يعمل مع الأشخاص أنفسهم، ويجلس في المقهى نفسه، ويقضي عطلته مع الأصدقاء أنفسهم. ثم يقول إن كل محاولات التعارف تأتي بالشخصيات ذاتها ولا تقوده إلى علاقة مناسبة.",idea:"ليست المشكلة دائمًا في غياب العروس، بل في أن الحياة لا تفتح نافذة جديدة. توسيع الدائرة لا يعني ملاحقة الناس أو تحويل كل نشاط إلى مشروع زواج. يعني بناء حياة أوسع تُظهر شخصيتك وتعرّفك إلى بشر جدد خارج القائمة المعتادة.",step:"انضم هذا الشهر إلى نشاط جديد يناسب اهتمامك، ووسّع حياتك أولًا قبل أن توسّع قائمة شروطك."},
{id:14,title:"لماذا تحمل بعض النساء اسم عائلتها واسم عائلة زوجها؟",world:"marriage",audience:"امرأة؛ رجل؛ عام",cta:"اقرأ الاسم بوصفه هوية لا إجراءً",scene:"كتبت اسم عائلتها إلى جانب اسم زوجها، فاتهمها بعضهم بأنها تخلت عن أصلها القديم. وحين أبقت اسمها وحده، رأى آخرون في ذلك رفضًا واضحًا لزوجها.",idea:"الاسم ليس خانة محايدة دائمًا؛ يحمل ذاكرة وانتماءً وعلاقة وصورة اجتماعية. بعض النساء يجمعن الاسمين، وبعضهن يخترن أحدهما، ولكل اختيار سياقه. تحويل الاسم إلى اختبار ولاء يسلب المرأة حقها في تعريف نفسها، ويحمّل الزوج معنى إضافيًا قد لا يريده أصلًا.",step:"اسأل صاحبة الاسم ماذا يعني اختيارها لها، واقرأه بوصفه هوية شخصية لا إجراءً يحتاج محاكمة."},
{id:15,title:"حين يصبح لباس البنت معركة يومية مع أمها",world:"kids",audience:"أم؛ ابنة؛ أب",cta:"حوّلوا المعركة إلى لغة وحدود",img:"kids_tense",scene:"تقف البنت أمام المرآة، وتدخل أمها لتطلب منها تغيير ملابسها فورًا. خلال دقائق يصبح القميص خلافًا عن الاحترام والناس والتربية، ويتحول الأب إلى قاضٍ بينهما.",idea:"معركة اللباس نادرًا ما تكون عن القماش وحده؛ خلفها خوف الأم، وحاجة البنت إلى امتلاك جسدها وصورتها، وحيرة الأب بين الحماية والسيطرة. الصراخ يجعل كل طرف يدافع عن كرامته بدل فهم الآخر. الحدود الصحية تحتاج تفسيرًا واتفاقًا لا إذلالًا يوميًا.",step:"اختاروا وقتًا بعيدًا عن باب الخروج، وناقشوا لباسًا واحدًا بلغة المخاوف والحدود لا بلغة الاتهام."},
{id:16,title:"هل ابنك في خطر… أم أن خوفك هو الذي كبر؟",world:"kids",audience:"أب؛ أم",cta:"ميّزوا الخطر الحقيقي من الخوف",img:"kids_tense",scene:"تأخر الابن نصف ساعة ولم يجب هاتفه، فتصورت الأم حادثًا، وتوقع الأب رفقة سيئة. عاد طبيعيًا، لكنه وجد تحقيقًا كاملًا بانتظاره قبل أن يخلع حذاءه.",idea:"الخوف على الأبناء طبيعي، لكنه قد يكبر حتى يصبح هو الذي يقود البيت. ليست كل إشارة خطرًا، وليس كل اطمئنان سذاجة. المراقبة الدائمة قد تدفع الابن إلى إخفاء التفاصيل، بينما السؤال الهادئ والقواعد المتفق عليها يبنيان مسؤولية حقيقية يمكن قياسها.",step:"حدّدوا مؤشرين واقعيين للخطر وقاعدة اتصال واضحة، ثم ميّزوا بين ما حدث فعلًا وما صنعه الخوف."},
{id:17,title:"حين تجنّد الأم البيت كله ضد ابنها",world:"kids",audience:"أم؛ أب؛ ابن",cta:"أوقفوا التحالفات داخل البيت",img:"kids_tense",scene:"اختلفت الأم مع ابنها، فاتصلت بأبيه وأخته وجدته وروت لكل واحد نسختها. عاد الابن مساءً ليجد البيت كله يتحدث معه كأنه متهم أمام لجنة كبيرة.",idea:"الاستعانة بالأسرة قد تبدو طلبًا للدعم، لكنها تصبح تحالفًا حين يُحاصر شخص واحد بأصوات الجميع. الابن قد يخطئ، والأم قد تتأذى، لكن تحويل الخلاف إلى حملة يمنع الاعتراف والإصلاح. البيت يحتاج مواجهة مباشرة بين أصحاب المشكلة، لا جمهورًا يوزع الأحكام.",step:"أعيدوا الخلاف إلى طرفيه، واطلبوا من بقية العائلة التوقف عن التدخل حتى تنتهي محادثة مباشرة بينهما."},
{id:18,title:"الولد الذي لا يُسمح له أن يحزن",world:"kids",audience:"أب؛ أم؛ ابن",cta:"امنحوه لغة للحزن لا أمرًا بالصمت",img:"kids_tense",scene:"عاد الولد باكيًا بعد خسارة فريقه أو خلافه مع صديق، فقيل له: كن رجلًا. مسح وجهه سريعًا، ثم تعلّم مع الوقت أن يغضب بدل أن يقول إنه موجوع.",idea:"منع الحزن لا يصنع صلابة؛ قد يدفع المشاعر إلى أبواب أخرى مثل العصبية أو الانسحاب أو السخرية. الولد يحتاج أن يعرف أن الرجولة لا تلغي الخوف والخيبة. الاعتراف بمشاعره لا يعفيه من المسؤولية، بل يمنحه لغة واضحة كي يتعامل معها.",step:"عندما يحزن، لا تطلب منه التوقف؛ سمِّ ما تراه واسأله أين يشعر به، وامنحه لغة بدل الصمت."},
{id:19,title:"البنت التي تعيش تحت المراقبة طوال الوقت",world:"kids",audience:"أب؛ أم؛ ابنة",cta:"ابنوا أمانًا لا سجنًا",img:"kids_tense",scene:"تسأل الأم ابنتها أين ذهبت ومع من وماذا قالت، ويفحص الأب هاتفها بحجة الحماية. صارت البنت تعطي إجابات قصيرة، لا لأنها آمنة، بل لأنها تتجنب التحقيق.",idea:"الرقابة قد تبدأ من خوف حقيقي، لكنها إذا شملت كل تفصيل تحوّل البيت إلى مكان لإخفاء الحياة. الثقة لا تعني غياب القواعد، والخصوصية لا تعني أن تفعل الابنة ما تشاء. الأمان ينمو حين تعرف الحدود وأسبابها وما يحدث عند خرقها.",step:"اتفقوا على ثلاث قواعد حماية واضحة، واتركوا ما عداها مساحة خاصة؛ ابنوا أمانًا يمكن الحديث داخله."},
{id:20,title:"بعض الأشجار يمكن اقتلاعها بنسمة عابرة",world:"boundaries",audience:"عام",cta:"قوِّ الجذور بدل لوم الريح",scene:"انتقده شخص عابر، فتغير مزاجه أسبوعًا كاملًا. انتهت علاقة قصيرة، فشعر أن حياته كلها اقتُلعت، كأن الجذور لم تكن ممسكة بشيء ثابت قبل هبوب الريح.",idea:"ليست كل ريح قوية؛ أحيانًا تكون الجذور متعبة أو مبنية على قبول الآخرين وحده. الحساسية ليست عيبًا، لكنها تصبح قيدًا حين تحدد كل كلمة قيمة الإنسان. تقوية الداخل الهادئة لا تمنع الألم، بل تمنعه من تعريف الحياة كلها وإسقاطها بسهولة.",step:"اختر قيمة فيك لا تعتمد على رأي أحد، ودوّن موقفين يثبتانها؛ قوِّ الجذور بدل لوم الريح."},
{id:21,title:"بعد الطلاق: لا تجعلوا الطفل رسولًا بينكما",world:"divorce",audience:"أب؛ أم؛ منفصل",cta:"احموا الطفل من بريد الكبار",scene:"يقول الأب لطفله: أخبر أمك أنني لن أدفع. وترد الأم: قل لأبيك إن موعده تغيّر. يحمل الطفل الرسالتين ويخاف من الرد قبل أن يفهم المشكلة.",idea:"بعد الطلاق قد يصعب الحديث المباشر، لكن استخدام الطفل يحوله إلى بريد يحمل غضب الكبار ولا يملك حق رفضه. الأب والأم قد يكونان مجروحين، إلا أن الابن ليس وسيطًا ولا شاهدًا ولا قاضيًا. حمايته الحقيقية تبدأ بإبعاده عن التفاوض واللوم.",step:"افتحا قناة مكتوبة ومحايدة بينكما للمواعيد والمصاريف، وامتنعا أسبوعًا كاملًا عن إرسال أي رسالة عبر الطفل."},
{id:22,title:"فشل الحياة الزوجية قد يشبه الفقد",world:"breakup",audience:"منفصل؛ زوج؛ زوجة",cta:"اسمح للحزن أن يُفهم قبل القرار التالي",scene:"انتهى الزواج رسميًا، لكن أحدهما ما زال يستيقظ وفي ذهنه البيت القديم وصوت المفاتيح. الناس يطلبون منه أن يبدأ من جديد، بينما هو يودع حياة كاملة.",idea:"فشل الزواج لا يعني غياب الحب أو أن الحزن ضعف. الإنسان لا يفقد شريكًا فقط؛ قد يفقد روتينًا وهوية وخطة مستقبل ومكانًا كان يسميه بيتًا. للطرفين حق كامل في الحداد بطريقتهما، من دون تحويل الألم إلى حكم أبدي على الذات.",step:"اكتب ثلاثة أشياء فقدتها غير الشخص نفسه، واسمح لهذا الحزن أن يُفهم قبل اتخاذ قرار العلاقة التالية."},
{id:23,title:"غيّرت عملي بعد 18 عامًا… فهل أغيّر زوجي بعد 27؟",world:"marriage",audience:"زوج؛ زوجة",cta:"ميّزوا بين الحاجة إلى التغيير والحاجة إلى الهرب",scene:"غيّرت عملها بعد ثمانية عشر عامًا وشعرت أنها ولدت من جديد، ثم نظرت إلى زواجها القديم وسألت: إذا كان التغيير أنقذني هناك، فلماذا لا ينقذني هنا؟",idea:"الرغبة في التغيير لا تعني دائمًا أن الزوج هو المشكلة، كما أن طول الزواج لا يوجب البقاء بأي ثمن. قد يحتاج الإنسان حياة أوسع داخل العلاقة، وقد تكون العلاقة نفسها استُنزفت. السؤال الأدق ليس: أغيّر أم أبقى؟ بل: ممَّ أهرب وإلى ماذا أريد الوصول؟",step:"افصلي بين ما تريدين تغييره في حياتك وما تريدين تغييره في زوجك، ثم قارني القائمتين بهدوء."},
{id:24,title:"الحزن الذي يبدأ قبل الوفاة",world:"grief",audience:"مرافق مريض؛ أسرة",cta:"لا تحمل الحزن الاستباقي وحدك",scene:"يجلس قرب سرير أبيه ويسمع الأطباء يتحدثون عن الاحتمالات الصعبة. الأب ما زال حيًا أمامه، لكنه يبدأ سرًا بتخيل البيت من دونه ثم يشعر بالذنب.",idea:"قد يبدأ الحزن قبل الوفاة عندما يرى الإنسان تغيّر من يحب ويخاف النهاية القادمة. هذا لا يعني أنه تخلّى عنه أو استعجل موته؛ إنه يحاول استيعاب فقد محتمل وهو ما زال يقوم بدور المرافق. كتمان هذا الحزن يزيد الوحدة في وقت يحتاج فيه إلى سند.",step:"اختر شخصًا آمنًا وقل له ما تخشاه بصراحة؛ لا تحمل الحزن الاستباقي وحدك خلف باب المستشفى."},
{id:25,title:"المرافق يتألم أيضًا… لكن الجميع يسأله عن المريض",world:"grief",audience:"مرافق مريض",cta:"للمرافق حق في مساحة وصوت",scene:"يسأله الجميع صباحًا: كيف المريض؟ يجيبهم بالتفصيل، ثم يغلق الهاتف ويجلس في السيارة منهكًا. لم يسأله أحد منذ أسابيع كيف ينام هو أو ماذا يحتمل.",idea:"المرافق ليس جهازًا يعمل بجانب المريض؛ يتعب ويغضب ويخاف، وقد يشعر بالذنب إذا احتاج ساعة لنفسه. الاهتمام به لا ينتقص من ألم المريض، بل يحمي قدرته على الاستمرار. من حقه أن يكون ابنًا أو زوجًا متألمًا، لا موظف رعاية فقط.",step:"اطلب هذا الأسبوع مساعدة محددة لساعتين، واستخدم الوقت لاحتياجك أنت؛ للمرافق حق في مساحة وصوت."},
{id:26,title:"حين يدخل المرض بين الزوجين",world:"grief",audience:"زوج؛ زوجة؛ مريض؛ مرافق",cta:"احميا العلاقة من أن تصبح مرضًا فقط",scene:"منذ بدأ العلاج، صارت كل أحاديثهما عن التحاليل والأدوية والمواعيد اليومية. نسيا كيف كانا زوجين قبل المرض، وصار أحدهما مريضًا دائمًا والآخر مجرد مرافق دائمًا.",idea:"المرض يفرض حضوره، لكنه لا يجب أن يبتلع هوية العلاقة كلها. المريض قد يكره أن يُختزل في جسده، والمرافق قد يختفي خلف المسؤوليات. الحفاظ على لحظة عادية بينهما ليس إنكارًا للواقع؛ إنه تذكير مهم بأن العلاقة أوسع من الملف الطبي.",step:"خصصا عشرين دقيقة لحديث لا يتعلق بالمرض أو العلاج، واحميا العلاقة من أن تصبح مرضًا فقط."},
{id:27,title:"الإخوة لا يحزنون بالطريقة نفسها",world:"grief",audience:"إخوة؛ أسرة",cta:"لا تقيسوا صدق الحزن بطريقة ظهوره",scene:"بعد الوفاة، بكت أختهم أمام الجميع، وانشغل أخوها بالمعاملات، واختفى الثالث في عمله. بدأ كل واحد يشك أن طريقة الآخر تعني أنه لم يحب الراحل كفاية.",idea:"الحزن لا يملك شكلًا موحدًا؛ شخص يبكي، وآخر يعمل، وثالث يصمت أو يتأخر انهياره. الاختلاف قد يعكس الشخصية والدور والقدرة على الاحتمال، لا مقدار المحبة الحقيقية. مقارنة الأحزان تضيف خلافًا عائليًا جديدًا إلى خسارة تحتاج مساحة ورحمة صادقة بين الجميع.",step:"اسأل أخاك عما يحتاجه بدل تقييم طريقته، ولا تقيس صدق الحزن بسرعة ظهوره أو كمية الدموع."},
{id:28,title:"هل قال لك ابنك إنه يحبك… أو إنه يكرهك؟",world:"kids",audience:"أب؛ أم؛ ابن؛ ابنة",cta:"الخطر ليس في كلمة الغضب بل في الصمت الطويل",img:"kids_tense",scene:"هل قال لك ابنك هذا العام إنه يحبك أو يكرهك؟ ربما لم يقل شيئًا منذ سنوات؛ يدخل ويخرج ويجيب باختصار، بينما تعيشان تحت سقف واحد وبينكما مسافة لا تُرى.",idea:"كلمة «أكرهك» مؤلمة، لكنها قد تعني أن الابن ما زال يجرؤ على إظهار غضبه. الصمت الطويل أحيانًا أكثر خوفًا؛ ربما لم يتعلم التعبير، أو ظن أن كلامه سيصبح محاضرة. الأمان الحقيقي يبدأ حين يعرف أن مشاعره لن تطرده من العلاقة.",step:"احتضنه اليوم بلا استجواب ولا نصيحة، وقل إنك حاضر عندما يريد الكلام؛ راقب الصمت لا كلمة الغضب وحدها."},
{id:29,title:"الصاحب الذي يتحول إلى عدو بعد سوء فهم",world:"friendship",audience:"صديق؛ صديقة؛ عام",cta:"افهم هل كشف الخلاف عداوة قديمة أم جرحًا قابلًا للإصلاح",scene:"بدأ الخلاف برسالة فُهمت خطأ، وانتهى بصديق ينشر الأسرار ويجمع الآخرين ضد صاحبه. صار السؤال: هل صنع سوء الفهم العداوة، أم كشف ما كان مختبئًا؟",idea:"ليس كل صديق يغضب عدوًا قديمًا، فالجرح قد يدفع الإنسان إلى تصرف سيئ يمكن إصلاحه. لكن طريقة الخلاف تكشف أحيانًا حدود الوفاء: هل بقي الاحترام؟ هل استُخدمت الأسرار سلاحًا؟ الحكم يحتاج النظر إلى السلوك المتكرر لا إلى لحظة واحدة فقط.",step:"افصل الفعل المؤذي عن تفسير النيات، ثم اسأل: هل ظهر جرح قابل للإصلاح أم نمط عداوة قديم؟"},
{id:30,title:"الطلاق لم يكن فضيحة في تاريخنا… فمتى أصبح كذلك؟",world:"divorce",audience:"منفصل؛ زوج؛ زوجة؛ عام",cta:"افصل بين انتهاء العلاقة وحكم المجتمع",scene:"خرجت امرأة من زواج مؤذٍ، فصار السؤال في الحي: لماذا لم تتحمل؟ وخرج رجل من زواج منهك، فقيل إنه هدم بيته، قبل أن يسأل أحد ماذا عاشا.",idea:"الطلاق ليس اختراعًا حديثًا ولا مناسبة سعيدة، لكنه تحوّل اجتماعيًا إلى شهادة فشل تلاحق الطرفين، وبقسوة أكبر أحيانًا المرأة. انتهاء عقد لا يكشف وحده مَن أخطأ أو كم حاول كل طرف. المجتمع يرى النتيجة، بينما تبقى تفاصيل الحياة خلف الباب.",step:"عندما تسمع عن طلاق، امتنع عن سؤال اللوم الأول، وافصل بين انتهاء العلاقة وبين حكم المجتمع على أصحابها."},
{id:31,title:"ضربونا حتى شبعنا… وها نحن أصبحنا رجالًا!",world:"kids",audience:"أب؛ أم؛ مربٍ؛ ابن",cta:"العنف قد يصنع صمتًا لا رجولة",img:"kids_tense",scene:"يروي رجل كيف ضربه المعلم على يديه حتى بكى، ثم يضحك ويقول: هكذا صرنا رجالًا. بجانبه ابنه صامت، يتعلم أن الألم يصبح مقبولًا إذا نجا صاحبه.",idea:"النجاة من العنف لا تثبت أن العنف كان ضروريًا. بعض من ضُربوا صاروا أقوياء رغم الضرب، وبعضهم حمل خوفه أو كرره مع غيره. الاعتراف الصريح بالأثر لا يهين جيلًا كاملًا؛ بل يمنع تحويل المعاناة القديمة إلى منهج تربية مؤذٍ جديد.",step:"قبل معاقبة طفل، اسأل ما الذي تريد تعليمه تحديدًا، واختر وسيلة لا تصنع صمتًا ثم تسميه رجولة."},
{id:32,title:"كلما كان العرس أكبر كان الطلاق أسرع",world:"engagement",audience:"مخطوب؛ مخطوبة؛ أهل",cta:"ناقشا معنى الزواج قبل كلفة الاحتفال",scene:"دفع الأهل ثمن قاعة ضخمة وطاولات وزينة وتصوير، بينما أجّل العروسان حديث المال والسكن والعمل. انتهت ليلة مبهرة، وبدأ صباح لم يُحضَّر له إلا قليلًا.",idea:"العرس الكبير لا يسبب الطلاق وحده، ولا كل احتفال مكلف علامة خطر. المشكلة حين يصبح الإنفاق هو المشروع، ويُقاس نجاح الزواج بحجم الليلة بدل الاستعداد للحياة بعدها. الاحتفال الكبير ينتهي سريعًا، أما القرارات المؤجلة فتدخل مع الزوجين إلى البيت الجديد.",step:"قبل إضافة كلفة جديدة للحفل، خصصا جلسة لمناقشة معنى الزواج والميزانية والحياة اليومية بعد انتهاء الاحتفال."},
{id:33,title:"كل امرأة جميلة وجميلة جدًا",world:"boundaries",audience:"امرأة؛ رجل؛ عام",cta:"الجمال مساحة ترى فيها المرأة نفسها لا مسابقة القرية",scene:"قبل سنوات كانت فتيات القرية يعرفن أسماء اثنتين أو ثلاث وُصفن بالجميلات، والبقية يراقبن بصمت. اليوم تعتني كل امرأة بأسلوبها، وترى في المرآة ما لم يسمح المجتمع لها برؤيته.",idea:"الجمال ليس حكمًا نهائيًا تصدره القرية، ولا يعني أن كل الوجوه متشابهة. حين تهتم المرأة بنفسها ولباسها وحضورها، فهي لا تخدع العالم؛ إنها تستعيد حقها في رؤية أنوثتها خارج المقارنة القهرية. والثقة لا تحتاج التقليل من امرأة أخرى كي تظهر.",step:"اختاري تفصيلًا تحبينه في حضورك واعتني به لنفسك؛ اجعلي الجمال مساحة ذاتية لا مسابقة اجتماعية."},
{id:34,title:"العائلة هي منشأ أشنع الجراح",world:"kids",audience:"طفل؛ شاب؛ ابنة؛ ابن بالغ",cta:"الأبناء يظلون أبناء حتى بعد أن يكبروا ويتزوجوا",img:"kids_tense",scene:"اتصل رجل متزوج بأخته بعد إعلان طلاق والديهما وقال: أشعر أنني طفل من جديد. له بيت وأبناء، لكن البيت الأول الذي ظنه ثابتًا انقسم فجأة.",idea:"الأبناء لا يتوقفون عن كونهم أبناء حين يكبرون أو يتزوجون. طلاق الوالدين قد يعيد أسئلة قديمة عن الأمان والانتماء والذكريات، من دون أن يعني ذلك رفض حق الوالدين في القرار. الجرح يحتاج اعترافًا، لا مطالبة الابن البالغ بأن يكون عاقلًا فورًا.",step:"اسمحوا للأبناء بالتعبير من دون جعلهم حكامًا أو وسطاء؛ تذكّروا أنهم يظلون أبناء مهما بلغ عمرهم."},
{id:35,title:"متى يكون التأقلم نضجًا ومتى يصبح استسلامًا؟",world:"boundaries",audience:"زوج؛ زوجة؛ عام",cta:"لا تجعل احتمال الألم فضيلة",scene:"تقول لنفسها إن تجاهل الإهانة نضج، ويقول لنفسه إن الصمت يحمي البيت. تمر السنوات، ويصبح ما كان مؤلمًا في البداية أمرًا عاديًا لا يناقشه أحد.",idea:"التأقلم يساعد الإنسان على عبور ضغوط لا يمكن تغييرها فورًا، لكنه يصبح استسلامًا حين يطلب منه إنكار كرامته أو خوفه المستمر. ليس كل احتمال فضيلة، وليس كل انسحاب قوة. الفارق يظهر في السؤال: هل يحفظ هذا التكيف حياتي أم يمحوها؟",step:"اكتب ثمن تأقلمك وفائدته بصدق، وحدد حدًا واحدًا لن تسمح بتجاوزه؛ لا تجعل احتمال الألم فضيلة."},
{id:36,title:"الشك الذي يكبر من دون دليل",world:"betrayal",audience:"زوج؛ زوجة",cta:"افصل بين الحقيقة والخوف قبل أن يقود أحدهما القرار",scene:"يتأخر في الرد على رسالة بسيطة، فتبدأ تعيد قراءة المحادثات القديمة بحثًا عن دليل لم تكن تبحث عنه من قبل. لا شيء ملموسًا حدث، لكن الشك بدأ يكبر وحده في رأسها.",idea:"الشك بلا دليل يتغذى من نفسه؛ كل تفصيل عادي يصبح إشارة محتملة، وكل سؤال بريء يصير استجوابًا. هذا لا يعني أن كل شك غير مبرر، فبعض الحدس يستحق الانتباه. لكن الفرق بين الحدس والقلق المتراكم هو وجود دليل فعلي، لا مجرد تخيل يكبر في الصمت.",step:"قبل أن تواجه شريكك، اكتب الدليل الفعلي الذي لديك منفصلًا عن الخوف الذي تشعر به."},
{id:37,title:"رسالة توقفت… ولم يأتِ تفسير",world:"breakup",audience:"عام",cta:"افهم الصمت قبل أن تفسّره وحدك",scene:"كانت الرسائل يومية، ثم صارت متباعدة، ثم توقفت تمامًا بلا سبب واضح ولا وداع. تفتح المحادثة كل يوم تقريبًا، تقرأ آخر رسالة، ولا تعرف ماذا حدث فعلًا.",idea:"التوقف المفاجئ بلا تفسير يترك فراغًا يميل العقل لملئه بأسوأ الاحتمالات عن نفسه. الصمت قد يعني أشياء كثيرة لا علاقة لها بك، لكنه يبقى مؤلمًا لأنه لا يمنحك فرصة لفهم ما جرى أو إغلاق الفصل بوضوح. الألم هنا حقيقي حتى لو بدت العلاقة قصيرة لمن حولك.",step:"اسمح لنفسك أن تحزن على ما انتهى بلا تفسير، بدل أن تقضي وقتك تبحث عن تفسير قد لا يأتي أبدًا."},
{id:38,title:"إشارات تستحق وقفة في أول لقاء — لا حكمًا جاهزًا",world:"engagement",audience:"شاب؛ شابة",cta:"لا تصدر حكمًا على إنسان من نصف ساعة",scene:"يجلس مع شخص لأول مرة، ويلاحظ تفصيلاً صغيرًا يزعجه — نبرة ساخرة، أو سؤال عابر عن المال. يتردد: هل هذا مهم، أم أنه يبالغ في القراءة؟",idea:"بعض التفاصيل تستحق وقفة حقيقية، وبعضها مجرد توتر لقاء أول لا أكثر. الفكرة ليست إصدار حكم فوري على إنسان بعد نصف ساعة، بل ملاحظة النمط إن تكرر لاحقًا. الحكم المتسرع يفوّت أشخاصًا طيبين متوترين، والتجاهل الكامل يفوّت إشارات حقيقية.",step:"اكتب الملاحظة التي أقلقتك، ولا تحكم عليها الآن؛ راقب إن تكررت في اللقاء الثاني قبل أي قرار."},
{id:39,title:"هل أنت جاهز للزواج، أم تهرب من شيء آخر؟",world:"engagement",audience:"شاب؛ شابة",cta:"ميّز الرغبة الحقيقية من الرغبة بإنهاء الوحدة",scene:"يقول إنه جاهز للزواج تمامًا، لكن كل من يقابلهم يذكّرونه بوحدته أو بضغط العائلة أو بزملائه الذين تزوجوا قبله. يسأل نفسه فجأة: هل أريد الزواج، أم أريد أن أتوقف عن الشعور بهذا؟",idea:"الرغبة في الزواج والرغبة في الهروب من وحدة أو مقارنة قد تتشابهان من الخارج تمامًا. الجاهزية الحقيقية تعني معرفة ما تريده من شريك، لا فقط إنهاء إحساس مزعج. لا عيب في الرغبة بإنهاء الوحدة، لكن الخلط بينها وبين الجاهزية يبني قرارًا على أساس هش.",step:"اسأل نفسك: لو اختفى كل ضغط الناس والمقارنة، هل ما زلت أريد الزواج بالسرعة نفسها؟"},
{id:40,title:"لماذا نتزوج إنسانًا على أمل أن يتغيّر؟",world:"engagement",audience:"شاب؛ شابة؛ مخطوب؛ مخطوبة",cta:"اقبل شريكك كما هو الآن، لا كما تتمناه لاحقًا",scene:"يعرف أن شريكه عصبي أو غير منظم أو بعيد عن العائلة، ويقول لنفسه: بعد الزواج سيتغير. يبني قراره كله على نسخة مستقبلية لم تتشكل بعد.",idea:"الزواج لا يصنع تغييرًا في شخص لم يبدأه بنفسه؛ في أحسن الأحوال يكشف الصفة أكثر تحت الضغط اليومي. قبول الشريك كما هو الآن لا يعني التنازل عن كل شيء، بل التمييز بين عادة صغيرة يمكن التفاهم حولها، وصفة جوهرية يُفترض قبولها كما هي.",step:"اكتب صفة تتمنى تغيّرها في شريكك، واسأل: هل أقبله إن بقيت كما هي إلى الأبد؟"},
{id:41,title:"متى يكون التراجع عن الخطبة قرارًا ناضجًا لا فشلًا؟",world:"engagement",audience:"مخطوب؛ مخطوبة؛ أهل",cta:"الشجاعة بالصدق مع النفس لا بإكمال ما بدأ",scene:"اكتشفت خلال الخطبة اختلافًا جوهريًا لم تتوقعه، لكنها تخاف الانسحاب بسبب كلام الناس وتكاليف الحفل الذي بدأ التحضير له. تسأل نفسها: هل أكمل خوفًا من العيب، أم أتراجع وأنا واثقة؟",idea:"التراجع عن الخطبة ليس فشلاً، بل استخدامًا صحيحًا للغرض الذي وُجدت من أجله: اختبار التوافق قبل الالتزام الكامل. الخوف من حكم الناس قد يدفع كثيرين لإكمال زواج يعرفون داخليًا أنه خطأ. الشجاعة هنا ليست بالإكمال، بل بالصدق مع النفس قبل أن يكبر الثمن.",step:"اكتب السبب الحقيقي للاستمرار: هل هو اقتناع، أم خوف من كلام الناس؟"},
{id:42,title:"حين يصبح البيت هادئًا لأن لا أحد يتكلم فعلًا",world:"marriage",audience:"زوج؛ زوجة",cta:"الصمت المريح أخطر من الخلاف الصاخب",scene:"يعودان من العمل، يتناولان الطعام، يشاهدان التلفاز، وينامان. لا صراخ ولا خلاف ظاهر، لكن آخر حديث حقيقي بينهما كان قبل أسابيع.",idea:"الهدوء قد يعني استقرارًا، وقد يعني أن كل طرف توقف عن محاولة الوصول للآخر. الفرق بين البيت الهادئ والبيت الصامت هو وجود الفضول: هل ما زال أحدكما يسأل عن يوم الآخر فعلًا؟ الصمت المريح أخطر من الخلاف الصاخب لأنه لا يشعر أحد بالحاجة لإصلاحه.",step:"اسأل شريكك سؤالًا لم تسأله منذ فترة عن يومه، وانتظر إجابة كاملة لا سطحية."},
{id:43,title:"هل كل خلاف يحتاج حلًا، أم يحتاج أن يُسمع فقط؟",world:"marriage",audience:"زوج؛ زوجة",cta:"اسأل: تريدني أسمعك أم أفكر معك بحل؟",scene:"تشتكي من إرهاق يومها، فيبدأ فورًا باقتراح حلول عملية. تغضب، لا لأن الحلول سيئة، بل لأنها أرادت أن يُسمع تعبها أولًا قبل أن يُصلحه أحد.",idea:"ليس كل حديث طلب حل؛ أحيانًا الشخص يريد أن يشعر أن أحدًا سمعه قبل أن يفكر معه في الخطوة التالية. تقديم الحل مباشرة قد يبدو مساعدة، لكنه أحيانًا يقفل الباب على المشاعر التي كانت تحتاج مكانًا لتُقال. السؤال البسيط الذي يغيّر مسار الحديث: هل تريد أن أسمعك، أم نفكر سوا بحل؟",step:"المرة القادمة، اسأل شريكك: تريدني أسمعك فقط، أم نفكر سوا بحل؟"},
{id:44,title:"حين يكون كل طرف يبذل جهدًا… بلغة لا يفهمها الآخر",world:"marriage",audience:"زوج؛ زوجة",cta:"افهم لغة شريكك في التعبير عن الاهتمام",scene:"يعمل بجد ليؤمّن البيت ويظن هذا أوضح تعبير عن حبه، بينما هي تنتظر كلمة أو لمسة صغيرة تشعرها بالاهتمام. كلاهما يبذل، وكلاهما يشعر أن الآخر لا يرى جهده.",idea:"الحب الذي لا يُفهم كأنه غياب حب، والجهد الذي لا يُرى كأنه لم يحدث. لا يعني هذا أن أحدهما مخطئ في طريقته، بل أن الطريقتين لا تلتقيان بعد. فهم لغة الآخر في التعبير عن الاهتمام قد يغيّر شعور العلاقة كاملة من دون أن يتغيّر الجهد المبذول أصلًا.",step:"اسأل شريكك مباشرة: ما الذي يجعلك تشعر أنني أهتم بك فعلًا؟ ثم افعله هذا الأسبوع."},
{id:45,title:"الروتين الذي يبتلع العلاقة من دون أن يشعر أحد",world:"marriage",audience:"زوج؛ زوجة",cta:"لا تدع الروتين يبتلع كل مساحة عفوية بينكما",scene:"الأيام تتشابه: عمل، بيت، أطفال، نوم. لا خلاف كبيرًا يحدث، لكن آخر مرة خرجا فيها وحدهما أو ضحكا بصدق معًا لا يتذكرانها بالضبط.",idea:"الروتين ليس عدوًا بحد ذاته؛ المشكلة حين يصبح كل الحياة المشتركة، بلا أي مساحة عفوية بينهما. العلاقات لا تنتهي غالبًا بحدث كبير، بل بتراكم أيام متشابهة نسي فيها الطرفان أنهما شريكان لا مجرد شركاء إدارة بيت.",step:"اختارا نشاطًا واحدًا صغيرًا هذا الأسبوع لا علاقة له بالبيت أو الأولاد، وافعلاه معًا فقط."},
{id:46,title:"هل يشعر الرجل والمرأة بالحاجة نفسها، أم بلغة مختلفة لها؟",world:"marriage",audience:"زوج؛ زوجة",cta:"اسأل عن حاجة شريكك بدل افتراضها",scene:"تحتاج أن يسألها عن شعورها بعد يوم صعب، ويحتاج هو أن تثق بقدرته على التعامل مع المشكلة بصمت من دون أسئلة كثيرة. كل واحد يظن أن حاجته هي الأصح.",idea:"الحاجة للأمان والاهتمام موجودة عند الطرفين غالبًا، لكن الطريقة التي يُعبَّر بها عنها قد تختلف. اختزال الفروق في «الرجال هكذا والنساء هكذا» يمنع رؤية الشخص الفعلي أمامك. الفهم الحقيقي يبدأ حين يسأل كل طرف عن حاجة الآخر بدل افتراضها من كتاب عام.",step:"اسأل شريكك مباشرة بأي شكل يشعر بالدعم أكثر: بالكلام، أم بالفعل، أم بالمساحة؟"},
{id:47,title:"هل يمكن أن تعود الثقة بعد أن تُكسر؟",world:"betrayal",audience:"زوج؛ زوجة",cta:"الثقة الجديدة تُبنى، لا تُستعاد كما كانت",scene:"بعد الاكتشاف، يحاول أحدهما إثبات أنه تغيّر، بينما ما زال الآخر يفحص كل رسالة وموعد. يسأل الاثنان بصمت: هل ما زال هناك أمل، أم أننا نُطيل نهاية محتومة؟",idea:"عودة الثقة ليست قرارًا لحظيًا، بل عملية تحتاج وقتًا واضحًا وشفافية حقيقية من الطرف الذي كسرها، وقدرة من الطرف الآخر على تقبّل عدم اليقين لفترة. لا يوجد ضمان أن تعود كاملة كما كانت؛ أحيانًا تُبنى ثقة جديدة مختلفة، لا استعادة القديمة.",step:"اتفقا على مؤشر واحد ملموس تقيسان به التقدم بعد شهر، بدل انتظار شعور مثالي يعود فجأة."},
{id:48,title:"متى يكون الطلاق قرارًا واعيًا لا هروبًا؟",world:"divorce",audience:"زوج؛ زوجة",cta:"ميّز القرار الواعي عن أول رد فعل على أزمة",scene:"بعد سنوات من المحاولة، تفكر جديًا بالطلاق، لكن صوتًا داخليًا يسألها: هل أنا أهرب من مشكلة يمكن حلها، أم أنهي علاقة انتهت فعلًا منذ زمن؟",idea:"القرار الواعي يأتي بعد محاولة صادقة للفهم والإصلاح، لا كأول رد فعل على أزمة. الهروب يحدث حين يُترك القرار للحظة غضب أو تعب لحظي. الفرق ليس في القرار نفسه، بل في الطريق الذي وصل به الإنسان إليه، وهل استنفد الخيارات الأخرى أم لا.",step:"اكتب ثلاث محاولات فعلية جربتها لإصلاح العلاقة قبل هذا القرار؛ إن كانت القائمة فارغة، فربما الوقت لم يحن بعد."},
{id:49,title:"كيف ينتهي زواج من دون أن يتحول إلى حرب؟",world:"divorce",audience:"زوج؛ زوجة",cta:"افصلا الألم الشخصي عن القرارات العملية",scene:"بدآ الانفصال باتفاق هادئ، لكن مع كل تفصيل — المال، الأثاث، مواعيد الأطفال — يتحول النقاش إلى معركة جديدة تشحن الطرفين وأي أحد قريب منهما.",idea:"انتهاء العلاقة لا يعني بالضرورة انتهاء الاحترام بين طرفيها؛ الحرب تبدأ عادة حين يتحول كل تفصيل عملي إلى ساحة لإثبات من كان مخطئًا. الانفصال الكريم ممكن حين يتفق الطرفان على فصل الألم الشخصي عن القرارات العملية، خصوصًا إن وُجد أبناء بينهما.",step:"قبل أي نقاش عملي، اتفقا على قاعدة واحدة: لا نستخدم التفاصيل لإيذاء بعضنا."},
{id:50,title:"هل ذنبك تجاه أبنائك حقيقي، أم فرضه عليك حكم الناس؟",world:"divorce",audience:"أب؛ أم؛ منفصل",cta:"ميّز الذنب المفيد عن ذنب حكم الناس",scene:"بعد الطلاق، تشعر بالذنب كل مرة تسمع فيها تعليقًا عابرًا عن أطفال بلا أب في البيت. تسأل نفسها: هل أنا فعلًا أؤذي أبنائي، أم أن هذا الشعور جاءني من نظرة الناس؟",idea:"الشعور بالذنب تجاه الأبناء بعد الانفصال حقيقي وله سبب أحيانًا، لكنه يكبر أكثر مما يستحق حين يتغذى من أحكام المجتمع لا من واقع الأبناء أنفسهم. الأبناء يتأثرون بجودة العلاقة معهم بعد الطلاق أكثر مما يتأثرون بوجود والديهم تحت سقف واحد. الذنب المفيد يدفعك للحضور أكثر؛ الذنب المستمد من حكم الناس يستنزفك بلا فائدة.",step:"اسأل نفسك: هل هذا الذنب يدفعني لأكون أبًا أو أمًا أفضل، أم يستنزفني بلا هدف؟"},
{id:51,title:"الطفل الذي يكبر بين خلافين لا ينتهيان",world:"kids",audience:"طفل؛ أب؛ أم",img:"kids_tense",cta:"أظهروا للطفل أن للخلاف نهاية ومصالحة",scene:"يجلس الطفل بألعابه بينما يسمع من الغرفة المجاورة أصواتًا مرتفعة، للمرة العاشرة هذا الشهر. لا أحد يشرح له ما يحدث، لكنه يتعلم أن يخفض صوته حتى لا يزيد الأمر سوءًا.",idea:"الأطفال لا يحتاجون بيتًا بلا خلاف؛ يحتاجون أن يروا الخلاف ينتهي بطريقة آمنة، لا أن يتكرر بلا حل ظاهر. الخلاف المستمر بلا نهاية يعلّم الطفل أن الغضب دائم وأن البيت مكان غير آمن، حتى لو لم يوجَّه إليه مباشرة. حماية الطفل ليست بإخفاء كل خلاف، بل بإظهار أن للخلافات نهاية ومصالحة.",step:"بعد أي خلاف أمام الطفل، دعوه يرى المصالحة أيضًا، ولو بجملة بسيطة تُقال أمامه."},
{id:52,title:"حين يربّي كل والد طفلًا مختلفًا في البيت نفسه",world:"kids",audience:"أب؛ أم",img:"kids_tense",cta:"اتفقا على قواعد مشتركة قبل أن تُطبقاها",scene:"يمنع الأب ما تسمح به الأم، وتغضب هي حين يتساهل هو فيما رفضته بالأمس. يتعلم الطفل بسرعة إلى من يذهب للحصول على الإجابة التي يريدها.",idea:"اختلاف أسلوبَي التربية بين الوالدين طبيعي، لكنه يتحول لمشكلة حين يفتقد قواعد مشتركة أمام الطفل. الطفل لا يتعلم من هذا الاختلاف حدودًا واضحة، بل يتعلم كيف يستغل الفجوة بين والديه. التوافق لا يعني أن يفكر الوالدان بالطريقة نفسها، بل أن يتفقا على القواعد الأساسية قبل أن يُطبقاها أمامه.",step:"اتفقا هذا الأسبوع على ثلاث قواعد ثابتة لا يخالفها أي منكما أمام الطفل، مهما اختلفتما لاحقًا خلف الأبواب."},
{id:53,title:"جمل صغيرة نقولها للأبناء… وتبقى فيهم سنوات",world:"kids",audience:"أب؛ أم",cta:"انقد الفعل لا الشخص",scene:"قال لابنه في لحظة غضب عابرة: أنت دائمًا هيك. نسي الأب الجملة بعد دقائق، لكن الابن كبر وهو يحمل هذه الصفة كجزء من هويته.",idea:"الكلمات التي تُقال في لحظات الغضب تبدو عابرة للوالد، لكنها تُسمع وتُصدَّق من طفل ما زال يبني فكرته عن نفسه. لا يعني هذا أن كل جملة غاضبة تترك ندبة دائمة، لكن الجمل المتكررة تصبح مع الوقت الصوت الذي يسمعه الطفل في رأسه لاحقًا. الفرق بين النقد اللحظي والوصف الدائم هو ما يحدد أثر الكلمة.",step:"انتبه المرة القادمة التي تنتقد فيها تصرفًا؛ انقد الفعل لا الشخص: قل «هذا التصرف أزعجني» لا «أنت دائمًا هيك»."},
{id:54,title:"حين يصبح الوالدان زميلَي عمل في تربية الأبناء، لا زوجين",world:"kids",audience:"زوج؛ زوجة",img:"kids_tense",cta:"احفظا مساحة للحديث لا علاقة لها بالأولاد",scene:"كل حديثهما اليوم كان عن جدول المدرسة، ومواعيد الطبيب، ومن سيوصل من. لم يسأل أحدهما الآخر سؤالًا لا علاقة له بالأولاد منذ وقت طويل.",idea:"التربية المشتركة تحتاج تنسيقًا حقيقيًا، لكنها حين تبتلع كل مساحة الحديث بين الزوجين، تتحول العلاقة إلى إدارة مشروع مشترك لا شراكة زوجية. الأبناء يحتاجون والدين يتعاونان، لكنهم أيضًا يستفيدون من رؤية علاقة حب حقيقية بين والديهم، لا فريق عمل منظم فقط.",step:"خصصا عشر دقائق هذا الأسبوع لحديث لا يذكر فيه اسم أي من الأبناء."},
{id:55,title:"حين يطلب أحد الأبناء ما حصل عليه أخوه بالضبط",world:"kids",audience:"أب أو أم",cta:"خصص وقتًا نوعيًا يثبت لكل طفل قيمته.",scene:"يقف الطفل أمامك ممسكًا بساعته ومحتجًا على دقائق إضافية قضيتها مع أخيه في حل وظيفة، متهمًا إياك بالتفضيل لمجرد أن درجات أخيه أعلى.",idea:"شعور الطفل بعدم الإنصاف لا ينبع بالضرورة من فوارق مادية حقيقية، بل من حاجته لإثبات أن مكانته مستقلة تمامًا عن تميز إخوته. المقارنات العفوية، حتى تلك المغلفة بمديح بريء، تزرع تنافسًا يرهق جو البيت لسنوات دون قصد.",step:"خصص لهذا الطفل عشرين دقيقة منفردة هذا الأسبوع تفعل فيها ما يختاره هو فقط، دون أي مقارنة."},
{id:56,title:"الأب الذي يتأخر في سيارته هربًا من ضجيج البيت",world:"kids",audience:"آباء",cta:"شارك في مهمة صغيرة لتصنع حضورًا حقيقيًا.",scene:"تطفئ محرك السيارة وتجلس فيها ربع ساعة إضافية أمام الباب، ممسكًا بالمقود ومترددًا في الصعود لمواجهة طلبات الأبناء وصراخهم بعد نهار عمل شاق ومستنزف.",idea:"تأخر الأب في الدخول لا يعني قلة محبته لأسرته، بل يعكس فراغ طاقته وصعوبة انتقاله السريع من ضغوط العمل إلى متطلبات التربية. في المقابل، يفسر الشريك والأبناء هذا الغياب ببرود المشاعر والتهرب من المسؤولية المشتركة.",step:"تنفس بهدوء لدقيقتين خارج البيت، وادخل لتشارك في مهمة واحدة محددة كقراءة قصة قبل نومهم."},
{id:57,title:"حين يغلق المراهق بابه ولا يجيب إلا بكلمة واحدة",world:"kids",audience:"أم أو أب",cta:"افتح مساحات مشتركة دون ضغط بالأسئلة.",scene:"تطرق باب غرفة ابنك المغلق منذ ساعات لتسأله عن يومه المدرسي، فيأتيك صوته من الداخل بنبرة مقتضبة وجافة تنهي الحوار فورًا: \"تمام، فش إشي\".",idea:"انسحاب المراهق وانغلاقه داخل غرفته غالبًا ما يكون طريقته البدائية لبناء خصوصيته وحماية مساحته من أسئلة يراها تحقيقًا وتفتيشًا في نواياه. فتح قنوات الحوار لا ينجح بالضغط والإلحاح، بل بخلق مساحات أمان غير مشروطة باعترافات.",step:"اختر نشاطًا عمليًا مشتركًا في السيارة أو المطبخ دون توجيه أي أسئلة شخصية، واترك له المبادرة."},
{id:58,title:"حين يصبح كشف الحساب البنكي سببًا لليلة صامتة",world:"marriage",audience:"زوج وزوجة",cta:"حددا مساحة إنفاق حرة تحمي شراكتكما.",scene:"تقع الأعين على فاتورة غير متوقعة أو سحب مالي لم يُناقش مسبقًا، فينقلب المساء إلى عتاب ثقيل ينتهي بنوم كل طرف متحصنًا بصمته في زاوية.",idea:"المال في العلاقة الزوجية نادرًا ما يكون مجرد أرقام حسابية؛ فهو يعني الأمان المستقبلي لأحد الطرفين، ويعني الاستمتاع والحرية للطرف الآخر. حين تغيب المصارحة حول فلسفة الإنفاق، يتحول كل شراء صغير إلى تهديد مباشر للاستقرار النفسي والشراكة.",step:"اتفقا هذا الأسبوع على تحديد مبلغ مالي شهري شخصي حر لكل طرف يُنفق دون مراجعة أو مساءلة."},
{id:59,title:"حين يتغير اتفاق الزوجين بعد مكالمة هاتفية مع الأهل",world:"marriage",audience:"زوج أو زوجة",cta:"حصّنا قراراتكما الزوجية بالاتفاق الداخلي أولًا.",scene:"تتفقان في الصباح على خطة محددة لقضاء العطلة، لكن اتصالًا هاتفيًا واحدًا مع العائلة يقلب الموازين فجأة، فيعود الشريك متراجعًا ومدافعًا عن رأي أهله بحماس.",idea:"بر الوالدين ومحبتهم قيمة إنسانية كبرى، لكن جعل القرارات الزوجية مكشوفة لتوجيهاتهم يُشعر الشريك بالتهميش وغياب الأمان. بناء حدود واضحة حول بيت الزوجية ليس عقوقًا، بل هو الحماية الضرورية لكي تنضج الشراكة بعيدًا عن الضغوط.",step:"التزما بقاعدة واحدة هذا الأسبوع: أي قرار يخص أسرتكما يُثبت داخليًا أولًا قبل إعلانه لأي طرف."},
{id:60,title:"الفراش الذي تنام فيه المسافات لا الأجساد",world:"marriage",audience:"زوجان",cta:"ابنِ الدفء النهاري لتذوب مسافات الفراش.",scene:"يطفئ أحدكما النور ويدير ظهره للآخر متصنعًا النوم السريع لتفادي أي اقتراب جسدي، بينما يراقب الطرف الآخر السقف بشعور خانق من الرفض والإحباط.",idea:"التباعد الجسدي بين الزوجين نادرًا ما يكون مشكلة بيولوجية بحتة، بل هو غالبًا مرآة لتراكم جروح عاطفية وكلام غير منطوق طوال النهار. حين تختفي اللمسة العابرة والكلمة اللطيفة في المطبخ والصالة، يصبح اللقاء الخاص عبئًا ومهمة ثقيلة.",step:"جربا الليلة تبادل عناق صامت ودافئ لدقيقة واحدة قبل النوم دون أي توقع لعلاقة حميمة."},
{id:61,title:"حين تكون المساعدة في البيت بانتظار الأوامر فقط",world:"marriage",audience:"زوج وزوجة",cta:"بادر بالمسؤولية المنزلية لتخفيف الحمل الذهني.",scene:"تجلس مجهدة بين فوضى الصحون والملابس ثم تنفجر غضبًا، فيرد الزوج باستغراب وصدق: \"لماذا الغضب؟ لو طلبتِ مني أن أغسل الصحون لفعلت ذلك فورًا\".",idea:"المشكلة ليست في عدد ساعات العمل المنزلي، بل في \"الحمل الذهني\" الذي يتحمله طرف واحد للتفكير والتخطيط والتوجيه كأنه مدير مشروع. الشراكة الزوجية الحقيقية تكتمل حين يشعر كل طرف بالمسؤولية التلقائية دون الحاجة إلى قائمة تعليمات.",step:"اختر مهمة منزلية محددة هذا الأسبوع وتولّ متابعتها كاملة من بدايتها لنهايتها دون انتظار طلب أحد."},
{id:62,title:"هل نؤثث بيتًا للعيش أم مسرحًا لإرضاء الناس؟",world:"engagement",audience:"خاطب ومخطوبة",cta:"اشطبا الكماليات لتؤسسا بداية خالية من الديون.",scene:"يحتد النقاش داخل متجر المفروشات بسبب صالون فاخر يرهق الميزانية بديون جديدة، حيث يراه أحدهما ضرورة أمام الأقارب ويراه الآخر عبئًا يخنق بداية حياتهما.",idea:"المشتريات المبالغ فيها في فترة الخطبة غالبًا ما تكون محاولة لإسكات مخاوف اجتماعية أو لإرضاء توقعات لا تخص الخطيبين فعلًا. قدرة الطرفين على التمييز بين ما يحتاجانه لراحتهما وما يفرضهما البرستيج هي أول اختبار لنضجهما واستقلاليتهما.",step:"اجلسا معًا هذا الأسبوع واشطبا ثلاثة بنود كمالية من ميزانية التجهيز لصالح تقليل الديون وبدء الزواج بارتياح."},
{id:63,title:"المحادثات التي تبقى لطيفة جدًا… وسطحية جدًا",world:"engagement",audience:"مقبلان على الزواج",cta:"اطرح سؤالًا جوهريًا لتكتشف التوافق الحقيقي.",scene:"يمر موعد اللقاء بأحاديث ممتعة وضحكات متبادلة وصور أنيقة، لكنكما تعودان إلى البيت مع إحساس مبهم بأنكما لم تمسا أي موضوع مصيري يخص المستقبل.",idea:"الإفراط في اللطف وتجنب إثارة أي خلاف خلال فترة التعارف يعكس خوفًا غير واعٍ من انكشاف عدم التوافق بينكما. العلاقة الناضجة تحتاج إلى اختبار طريقة التفكير في الأزمات والتربية والمال، وليس فقط الاكتفاء بتبادل الإعجاب والكلمات المريحة.",step:"اطرح على خطيبك هذا الأسبوع سؤالًا واحدًا عميقًا حول كيفية تفضيله لإدارة الخلاف والغضب بينكما مستقبلًا."},
{id:64,title:"حين يدفع الخطيب فاتورة خذلان تركه شخص آخر",world:"engagement",audience:"شابة أو شاب مقبل على الزواج",cta:"انظر لخطيبك بحاضره لا بخيبات ماضيك.",scene:"يتأخر في الرد على مكالمة نصف ساعة، فتستيقظ داخلك موجة رعب وشكوك قديمة، وتبدأ في صياغة عتاب قاسٍ مستحضرًا خيانة تعرضت لها في علاقة سابقة.",idea:"دخول تجربة جديدة بقلب مثقل بندوب قديمة يجعلنا نترصد الأخطاء غير المقصودة ونفسرها كأدلة على خذلان وشيك. من العدل والإنسانية منح الشريك الحالي مساحة بيضاء ليُعرَف بنفسه وسلوكه، لا أن يتحمل ديونًا عاطفية لشخص غادر.",step:"اكتب على ورقة الفارق بين ما عشته في الماضي وسلوك شريكك الحالي، وركز على واقعه فقط."},
{id:65,title:"ليلة الصمت الأولى بعد تسليم مفتاح البيت",world:"divorce",audience:"مطلق أو مطلقة",cta:"ثبّت روتينك اليومي لتهدئة رعب البدايات.",scene:"تغلق الباب على نفسك في منزلك الجديد بعد إتمام الإجراءات ونقل الأغراض، ليحيط بك صمت ثقيل وموحش يمتزج فيه هدوء النجاة برعب الوحدة القادمة.",idea:"انتهاء الزواج حتى لو كان بقرار واعٍ وبدافع التخلص من واقع مستحيل، يظل تجربة بتر لروتين وعادات وبناء إنساني امتد لسنوات. الشعور بالضياع والفراغ في البدايات لا يعني أبدًا أن قرارك كان خاطئًا، بل هو مسار حزن طبيعي.",step:"حدد لنفسك هذا الأسبوع جدولًا بسيطًا للاستيقاظ والوجبات، وحافظ على التواصل اليومي مع شخص داعم واحد."},
{id:66,title:"حين تصبح المناسبة العائلية محاكمة لمن اختار الانفصال",world:"divorce",audience:"امرأة أو رجل مر بتجربة الطلاق",cta:"احسم الفضول بعبارة هادئة تحفظ خصوصيتك.",scene:"تدخل قاعة المناسبة فتلتقي بنظرات مشفقة وهمسات جانبية، تليها أسئلة فضولية مغلفة بالحرص مثل: \"ألم تكن هناك طريقة للصلح من أجل العائلة؟\".",idea:"يميل المحيط الاجتماعي دائمًا إلى لوم الأطراف التي تخرج من الأطر المألوفة لتهدئة قلقهم الخاص تجاه فكرة تفكك الأسر. حماية كرامتك لا تتطلب الدخول في معارك دفاعية، بل تنبع من الثبات على أن تفاصيل بيتك سر محفوظ.",step:"جهز جملة رد واحدة هادئة وحاسمة مثل: \"اخترنا الأفضل للجميع ونمضي للأمام\"، وأنهِ بها أي استدراج للكلام."},
{id:67,title:"حقيبة الطفل التي تنتقل بين البيتين كل نهاية أسبوع",world:"divorce",audience:"والدان منفصلان",cta:"اجعل لقاء العتبة مريحًا لنفسية طفلك.",scene:"تقف على الباب لتسليم الحقيبة الصغيرة والطفل ينظر في الأرض بقلق، محاولًا قراءة تعابير وجهيكما ليتأكد هل لقاؤكما السريع سيمر بسلام أم بصدام وشيك.",idea:"نجاح مرحلة ما بعد الطلاق لا يحدده غياب الخلافات تمامًا، بل قدرة الوالدين على تجنيب الأبناء دفع ثمن خلافهما الشخصي. تحويل لحظة التسليم إلى مساحة هادئة يعطي الطفل الأمان بأن والديه، رغم افتراقهما، ما زالا حصنه الحامي.",step:"احرص على أن تكون عملية تسليم طفلك هذا الأسبوع مصحوبة بابتسامة خفيفة وكلمة تشجيع دون أي نقاش جانبي."},
{id:68,title:"حين يتحول تفقد هاتف الشريك إلى هاجس ليلي",world:"betrayal",audience:"زوج أو زوجة يعانيان من الشك",cta:"أخرج الهواتف من الغرفة لتوقف التفتيش.",scene:"يغط الشريك في نوم عميق بينما تقترب يدك المرتجفة من شاشة هاتفه المضيء في الظلام، تفتش بلهفة في الرسائل وسجلات المكالمات لعلها تعثر على شيء.",idea:"التحول إلى دور المحقق السري يسرق السلام الداخلي ويبني وهمًا بأن الأمان يأتي من كثرة المراقبة والتدقيق التقني. البحث المستمر خلف الشاشات لا يرمم ثقة مهزوزة، بل يعمق مشاعر الهوان والاحتراق النفسي لصاحبه.",step:"ضع هاتفك وهاتفه خارج غرفة النوم لثلاث ليالٍ متتالية، واستبدل التفتيش بمواجهة صريحة حول قلقك."},
{id:69,title:"الحديث السري الذي يبدأ بجملة: هو مجرد زميل يفهمني",world:"betrayal",audience:"شخص متزوج",cta:"قس أمانتك بما تستطيع إظهاره لشريكك.",scene:"تسحب هاتفك إلى زاوية معزولة لتكمل محادثة خاصة عن مشاعرك وأسرار يومك مع زميل عمل، مبررًا لنفسك أن الأمر مجرد فضفضة بريئة لا تتضمن أي تجاوز جسدي.",idea:"انكسار الثقة لا يبدأ غالبًا بالخيانة الجسدية، بل يبدأ حين تُمنح الأسرار النفسية والمساحات الحميمية لشخص غريب بدلًا من الشريك. السرية هي المقياس الحقيقي للخطر؛ فما لا تستطيع مشاركته مع زوجك علنًا هو ثقب في جدار بيتك.",step:"اسأل نفسك بصدق: هل أقبل أن يقرأ شريكي هذه الرسائل الآن؟ إذا كان لا، فأوقف المحادثة فورًا."},
{id:70,title:"صدمة الدليل القاطع… وماذا بعد نوبة الصراخ؟",world:"betrayal",audience:"شريك مصدوم بالخيانة",cta:"أجّل القرارات المصيرية حتى تهدأ عاصفة الصدمة.",scene:"تسقط الرسائل والأدلة على الأرض بعد انكشاف الحقيقة، يعم صراخ وبكاء هيستيري، يليه هدوء مرعب في البيت مع حيرة مميتة: هل أرحل فورًا أم أبقى؟",idea:"لحظة كشف الخيانة تضع الإنسان تحت ضغط صدمة عصبية تحجب التفكير المنطقي المتزن، وتولد رغبة جامحة في اتخاذ قرارات متطرفة وفورية. لا تلزم نفسك بحسم مستقبلك ومصير أسرتك في ليلة الصدمة؛ فالوضوح يحتاج وقتًا لاستيعاب الموقف.",step:"امنح نفسك أسبوعين من الهدوء دون اتخاذ أي قرار نهائي بالانفصال أو البقاء، وركز على سلامتك الجسدية."},
{id:71,title:"حين يطلب المخطئ نسيان الماضي والمجروح لم يهدأ بعد",world:"betrayal",audience:"زوجان في مسار التعافي بعد الخيانة",cta:"أظهر صبرًا واستمع لمخاوفه بلا دفاع.",scene:"يطرح الطرف المجروح سؤالًا متكررًا عن تفاصيل قديمة، فيتأفف المخطئ بنفاد صبر قائلًا: \"لقد اعتذرت وانتهى الأمر، إلى متى ستظلين تعيدين نفس القصة القديمة؟\".",idea:"استعادة الثقة لا تتحقق بمرور الوقت وحده أو بطلب إغلاق الملف سريعًا، بل تتطلب صبرًا طويلًا وشفافية كاملة من الطرف الذي ارتكب الخطأ. تكرار الأسئلة ليس رغبة في الانتقام، بل محاولة مضطربة من عقل المجروح للتأكد من أمان الواقع الجديد.",step:"استمع هذا الأسبوع لمخاوف شريكك دون تبرير أو دفاع، مؤكدًا التزامك بالشفافية الكاملة لاستعادة أمانه."},
{id:72,title:"تتبع الشريك السابق في العتمة خلف شاشة الهاتف",world:"breakup",audience:"شخص بعد انتهاء علاقة عاطفية",cta:"اقطع حبال المراقبة لتبدأ الشفاء الحقيقي.",scene:"تتنقل بين الصور وحالات التواصل الخاصة بحبيبك السابق حتى الفجر، تراقب تفاصيل يومه ومن يتابعه، باحثًا عن أي تلميح يثبت أنه يعاني بعدك مثلك تمامًا.",idea:"إبقاء خيط المراقبة مشدودًا يغذي وهم التواصل ويجعل التعافي من وجع الفراق مستحيلًا، كمن ينكأ جرحه بيده كلما كاد يلتئم. من اختار الخروج من حياتك لن تجد تفسير رحيله في صوره الجديدة بل في قبول حقيقة الغياب.",step:"احظر أو ألغِ متابعة حساباته تمامًا هذا الأسبوع لتمنح نفسك فرصة حقيقية لبدء النسيان والتعافي."},
{id:73,title:"حين يختفي من حياتك فجأة دون كلمة وداع واحدة",world:"breakup",audience:"من تعرض للانسحاب المفاجئ",cta:"اكتب وداعك لنفسك وتوقف عن انتظار إجابته.",scene:"ترسل رسالتك وتنتظر لأيام ردًا لا يأتي، لتكتشف أنك أصبحت محظورًا في كل مكان دون سابق إنذار، ودون أي تفسير يبرر هذا الاختفاء القاسي والمفاجئ.",idea:"الاختفاء المفاجئ والهروب يعكسان عجز الطرف الآخر عن المواجهة وتحمل المسؤولية الإنسانية، ولا يعبران أبدًا عن قلة قيمتك أو ارتكابك لخطأ فادح. البحث المرهق عن إجابات لدى شخص هرب لن يمنحك السلام، بل يبقيك أسيرًا لتساؤلات لا تنتهي.",step:"اكتب رسالة وداع غير مرسلة تعبر فيها عن مشاعرك بالكامل في دفترك، ثم أغلق الدفتر وامضِ."},
{id:74,title:"محاولة البقاء كأصدقاء فور انتهاء قصة الحب",world:"breakup",audience:"شابان بعد الانفصال",cta:"تباعدا بصدق لتتعافيا قبل أي خيار آخر.",scene:"تجلسان في مقهى بعد أسبوعين من الانفصال، متبادلين ابتسامات متكلفة تحت ستار \"الصداقة الناضجة\"، بينما تكشف نظرات العيون حنينًا وغيرة مكبوتة تكاد تنفجر.",idea:"محاولة التحول الفوري إلى أصدقاء بعد علاقة عاطفية عميقة غالبًا ما تكون هروبًا غير واعٍ من ألم الفراق الحقيقي وتأجيلًا للوجع. الصداقة النقية لا يمكن أن تُبنى فوق مشاعر لم تأخذ حقها الكامل في الحزن والانطفاء الطبيعي.",step:"اتفقا على وقف كل أشكال التواصل لمدة شهرين كاملين لإعطاء المشاعر فرصة حقيقية للاستقرار."},
{id:75,title:"حين تدرك أنك الوحيد الذي يبادر بالسؤال دائمًا",world:"friendship",audience:"صديق يشعر بالاستنزاف",cta:"توقف عن المبادرة لتزن حجم العلاقة الحقيقي.",scene:"تراجع محادثاتك لتكتشف أنك الطرف الوحيد الذي يسأل ويبادر باللقاء ويقترح المواعيد، بينما لا يظهر الآخر في حياتك إلا إذا كان يحتاج منك خدمة.",idea:"الصداقات الإنسانية الجميلة تقوم على التبادل والتوازن العفوي، والمبالغة في التمسك بمن لا يبادر تفرز شعورًا بالمرارة والخذلان بمرور الوقت. التوقف عن المبادرة المفرطة ليس قسوة ولا إعلان قطيعة، بل هو اختبار لوزنك الحقيقي في قلبه.",step:"توقف عن المبادرة بالتواصل مع هذا الصديق هذا الأسبوع، وراقب هل يتحرك هو لملء هذا الفراغ."},
{id:76,title:"الفرح بنجاح الصديق حين تختلط به غصة مقارنة",world:"friendship",audience:"صديق يمر باختبار المقارنة",cta:"اعترف بغيرتك وركز على خصوصية مسارك الشخصي.",scene:"تعانق صديقك بحرارة في حفل ترقيته أو خطوبته، ثم تركب سيارتك وحيدًا فتشعر بضيق مفاجئ وغصة في حلقك، مقارنًا واقعه المتقدم بمسيرتك التي تراها متعثرة.",idea:"مشاعر الغيرة العابرة بين الأصدقاء طبيعية وبشرية للغاية، والاعتراف بها بينك وبين نفسك لا يجعلك إنسانًا سيئًا أو حسودًا. المهم هو ألا تترك هذا الشعور يتحول إلى سلوك بارد أو تنقيص خفي من شأنه، بل أن تفهم احتياجك الداخلي.",step:"اكتب ثلاثة أشياء تميز رحلتك الخاصة وتفخر بها، ثم أرسل لصديقك رسالة تهنئة دافئة تؤكد محبتك له."},
{id:77,title:"الصاحب الذي يتصل فقط ليفرغ همومه ثم يختفي",world:"friendship",audience:"شخص يعاني من صديق مستنزف",cta:"حدد وقت المكالمة لحماية طاقتك من الاستنزاف.",scene:"ترى اسمه على شاشة هاتفك فتشعر بانقباض فوري، لعلمك أن المكالمة ستكون ساعة كاملة من التذمر والشكوى المتواصلة، دون أن يمنحك دقيقة واحدة ليسألك كيف حالك.",idea:"مساندة الأصدقاء في أزماتهم أصل أصيل في الوفاء، لكن التحول إلى مستودع لتفريغ الطاقات السلبية دون احترام لوقتك وطاقتك يفسد جوهر العلاقة. وضع الحدود مع من نحب ليس أنانية، بل هو الوسيلة الوحيدة لمنع وصول العلاقة إلى الانفجار.",step:"حدد مسبقًا زمن مكالمتك القادمة معه بلطف قائلًا: \"معي عشر دقائق فقط قبل أن أبدأ انشغالي\"."},
{id:78,title:"حين يثقل على المريض أن يطلب شربة ماء",world:"grief",audience:"مريض أو مسن",cta:"اقبل الرعاية بكرامة فالعطاء حق متبادل.",scene:"ترقد في السرير وتشعر بالعطش، لكنك تتردد طويلًا في مناداة ابنتك أو شريكتك، شاعرًا بالضيق والخجل من كونك صرت عبئًا يحتاج لخدمة الآخرين في أبسط التفاصيل.",idea:"المرض يخدش شعور الإنسان باستقلاليته وكرامته، ويزرع خوفًا دفينًا من أن يتحول وجوده إلى حمل يثقل كاهل المحيطين به. قبول الرعاية والمساعدة بحاجة إلى شجاعة تشبه شجاعة العطاء؛ فالضعف الإنساني في أوقات الشدة حق أصيل لا عيب فيه.",step:"اطلب ما تحتاجه اليوم بابتسامة خفيفة وكلمة شكر، ودع من يحبك يعبر عن وفائه لك بالخدمة."},
{id:79,title:"الابتسامة الأولى بعد الفقد التي يعقبها تأنيب الضمير",world:"grief",audience:"فاقد لشخص عزيز",cta:"ابتسم دون ذنب فالحياة خُلقت لتستمر.",scene:"تجلس بين رفاقك فتفلت منك ضحكة عفوية على طرفة عابرة، وفجأة تتجمد ملامحك ويضربك وخز قاسٍ في صدرك: \"كيف أبتسم وحبيبي يرقد تحت التراب؟\".",idea:"الحزن على الراحلين لا يعني أن نقيم في العتمة إلى الأبد، واللحظات التي نبتسم فيها ليست خيانة لذكراهم ولا استهانة بقيمتهم في قلوبنا. التعافي عملية بطيئة تتسلل فيها الحياة لترمم أرواحنا من جديد، والراحة العابرة جزء من رحمة الله بقلوبنا المكلومة.",step:"اسمح لنفسك بالابتسام دون تأنيب حين تلوح لحظة فرح، وتذكر أن من رحل يتمنى لك السلام."},
{id:80,title:"خزانة الراحل… والتردد في نقل أول قطعة ملابس",world:"grief",audience:"فرد في أسرة تعيش الفقد",cta:"تدرج في فرز الأغراض لتودع بسلام.",scene:"تقف أمام خزانة ملابس والدك الراحل ممسكًا بمعطفه الذي ما زال يحمل رائحته وعطره، عاجزًا عن ترتيب أغراضه خوفًا من أن يعني ذلك محو ذكراه من البيت.",idea:"التعامل مع متعلقات من نحبهم بعد رحيلهم مواجهة حاسمة مع واقع الفراق النهائي، والتسرع في توزيعها تحت ضغط المحيطين قد يورث ندمًا وغصة. التدرج في إخلاء المساحات يمنح الروح وقتها الكافي لتقبل الغياب دون شعور بالقسوة أو الإكراه.",step:"اختر قطعة واحدة عزيزة جدًا لتحتفظ بها في صندوق ذكرياتك، وابدأ بفرز قطعة واحدة أخرى للتبرع بها."},
{id:81,title:"المرافق الذي يخشى أن يمرض فيسقط من يعتمد عليه",world:"grief",audience:"مرافِق لمريض مزمن",cta:"ارعَ صحتك لتتمكن من رعاية من تحب.",scene:"تستيقظ متألمًا من إرهاق جسدك وقلة نومك المتواصل، وتخفي وجعك بسرعة خوفًا من أن تنهار صحتك، فيضيع من اعتاد على وجودك الدائم بجانبه ليل نهار.",idea:"رعاية مريض لوقت طويل تستهلك الطاقات النفسية والجسدية بصمت، والمرافق ينسى نفسه غالبًا تحت وطأة الشعور بالواجب والإيثار. لا يمكن لأحد أن يمنح الرعاية والأمان من جسد منهك وروح محترقة؛ العناية بنفسك شرط أساسي لدوام قدرتك على العطاء.",step:"اطلب من قريب لك أن ينوب عنك هذا الأسبوع لمدة ثلاث ساعات كاملة لتنال قسطًا مريحًا من النوم."},
{id:82,title:"قول نعم للآخرين حين يكون داخلك يصرخ بالرفض",world:"boundaries",audience:"من يجد صعوبة في وضع الحدود",cta:"قل \"لا\" بأدب لتحمي سلامك ووقتك.",scene:"تبتسم وتوافق على الفور على أداء مهمة إضافية تطلب منك، بينما يعتصر الألم صدرك من التعب، وتحدث نفسك بغضب: \"لماذا لم أعتذر ببساطة؟\".",idea:"الخوف المزمن من قول \"لا\" يرتبط برغبة غير واعية في نيل القبول وتجنب غضب الآخرين، حتى لو كان الثمن صحتك وسلامك النفسي. العلاقات الصحية لا تُبنى على التضحيات المستمرة، والاعتذار المهذب هو الحامي الوحيد من تراكم كبت يتحول لاحقًا إلى انفجار.",step:"تدرب اليوم على قول هذه العبارة لطلب واحد غير طارئ: \"أعتذر منك، لا أستطيع تلبية ذلك هذه المرة\"."},
{id:83,title:"القرارات التي تؤجلها خوفًا مما سيقوله الناس عنك",world:"boundaries",audience:"من يعيش تحت ضغط التوقعات",cta:"امضِ في قرارك؛ فحياتك ملك لك وحدك.",scene:"تحتار في اتخاذ قرار يخص حياتك أو تخصصك أو عملك، وتتراجع في اللحظة الأخيرة لأنك تخيلت همسات الأقارب وانتقادات المعارف في الجلسات القادمة.",idea:"الناس ينشغلون بنقد قراراتك لدقائق ثم يعودون لتفاصيل حياتهم الخاصة، بينما تبقى أنت وحدك من يدفع ثمن التردد لسنوات طويلة. السعي لإرضاء كل من حولك غاية مستحيلة، وتصميم حياتك وفق مقاسات الآخرين يضمن خسارة اتصالك الصادق بذاتك وبقيمك الحقيقية.",step:"حدد قرارًا واحدًا معطلًا كنت تؤجله خوفًا من كلام الناس، واتخذ خطوته الأولى بصمت هذا الأسبوع."},
{id:84,title:"حين تجعلك شاشات الآخرين تشعر بأنك متأخر عن الجميع",world:"boundaries",audience:"كل من يتصفح وسائل التواصل",cta:"أبعد الشاشة لتستعيد تقديرك لرحلتك الخاصة.",scene:"تتصفح هاتفك وأنت مستلقٍ في غرفتك البسيطة، فترى رحلات أصدقائك وإنجازاتهم المعروضة بأناقة، لتشعر بغصة خفية وإحباط قاهر من ركود حياتك الخاصة.",idea:"ما نشاهده على الشاشات هو خلاصة منتقاة من أجمل لحظات الآخرين بعد إخفاء معاركهم وأوجاعهم وكواليسهم المتعبة بعناية. مقارنة واقعك العادي بواجهات استعراضية للاحتفالات يسرق منك رضاك الداخلي، ويشوه إحساسك بقيمة خطواتك الخاصة في مسيرتك الفردية.",step:"احذف أو عطل تطبيق التواصل الاجتماعي الأكثر استنزافًا لك لمدة 48 ساعة متواصلة في عطلة نهاية هذا الأسبوع."},
];

function articleSlug(a){return a.id+'-'+cleanSlug(a.title);}

function worldURL(w){return '#/world/'+w.slug;}
function articleBySlug(slug){return ARTICLES.find(a=>articleSlug(a)===decodeURIComponent(slug));}
function routeHash(){
  if(location.hash && location.hash.startsWith('#/')) return location.hash;
  const parts=decodeURIComponent(location.pathname).split('/').filter(Boolean);
  if(!parts.length || parts[0]==='index.html') return '#/';
  if(parts[0]==='articles' && parts[1]){const a=articleBySlug(parts[1]);return a?'#/article/'+a.id:'#/404';}
  if(parts[0]==='worlds' && parts[1]) return '#/world/'+parts[1];

}

function toggleMobileMenu(){
  const menu = document.getElementById('mobileMenu');
  const btn = document.querySelector('.menu-toggle');
  menu.classList.toggle('open');
  if(btn) btn.setAttribute('aria-expanded', menu.classList.contains('open') ? 'true' : 'false');
}
function closeMobileMenu(){
  const menu = document.getElementById('mobileMenu');
  const btn = document.querySelector('.menu-toggle');
  menu.classList.remove('open');
  if(btn) btn.setAttribute('aria-expanded','false');
}

// الشريط يظهر فقط بالصفحات المرتبطة موضوعيًا بمحتوى الأفكار (الانفصال، الخيانة، الطلاق، الزواج)
function shouldShowQuoteStrip(hash){
  const relevantWorlds = ['marriage','breakup','betrayal','divorce'];
  if(hash==='#/' || hash==='#/library' || hash==='#/worlds' || hash==='#/thoughts') return true;
  if(hash.startsWith('#/world/')){ return relevantWorlds.includes(hash.split('/')[2]); }
  if(hash.startsWith('#/article/')){ const a = articleById(hash.split('/')[2]); return a ? relevantWorlds.includes(a.world) : false; }
  return false;
}

let libraryFilter = 'all';
let libraryQuery = '';
const QUICK_TOPICS = ['طفل','مراهق','ابن بالغ','خطبة','زواج','طلاق','خيانة','صداقة','فقد','حدود'];
function articleSearchText(a){return [a.title,a.audience,a.cta,a.scene,a.idea,a.step,worldBySlug(a.world)?.title].filter(Boolean).join(' ').toLowerCase();}
function visibleLibraryArticles(){
  const q=libraryQuery.trim().toLowerCase();
  return ARTICLES.filter(a=>(libraryFilter==='all'||a.world===libraryFilter)&&(!q||articleSearchText(a).includes(q)));
}
function libraryPageHTML(){
  const items=visibleLibraryArticles();
  return `
  <section class="section wrap" style="padding-top:52px;">
    <div class="eyebrow">تصفّح وابحث</div>
    <h1>مكتبة المقالات</h1>

    <input class="library-search" id="librarySearch" type="search" value="${libraryQuery}" placeholder="مثال: ابني المراهق، صمت بين الزوجين، خيانة، طلاق..." oninput="setLibraryQuery(this.value)" aria-label="البحث في المقالات">
    <div class="quick-topics">${QUICK_TOPICS.map(t=>`<button class="quick-topic" onclick="setLibrarySearch('${t}')">${t}</button>`).join('')}<button class="quick-topic" onclick="setLibrarySearch('')">مسح البحث</button></div>
    <div class="filters" id="libFilters">
      <button class="filter-btn ${libraryFilter==='all'?'active':''}" onclick="setLibFilter('all')">الكل (${ARTICLES.length})</button>
      ${WORLDS.map(w=>`<button class="filter-btn ${libraryFilter===w.slug?'active':''}" onclick="setLibFilter('${w.slug}')">${w.title} (${articlesByWorld(w.slug).length})</button>`).join('')}
    </div>
    <div class="search-status" id="searchStatus">${items.length} مادة مناسبة</div>
    <div class="grid-articles" id="libGrid">${items.length?items.map(articleCardHTML).join(''):'<div class="trust-card"><h3>لم نجد نتيجة مطابقة</h3><p>جرّب كلمة أبسط، أو اختر عالمًا من الأعلى.</p></div>'}</div>
  </section>`;
}
function refreshLibrary(){
  const grid=document.getElementById('libGrid'),status=document.getElementById('searchStatus');
  if(!grid||!status)return;
  const items=visibleLibraryArticles();
  grid.innerHTML=items.length?items.map(articleCardHTML).join(''):'<div class="trust-card"><h3>لم نجد نتيجة مطابقة</h3><p>جرّب كلمة أبسط، أو اختر عالمًا من الأعلى.</p></div>';
  status.textContent=items.length+' مادة مناسبة';
  document.querySelectorAll('#libFilters .filter-btn').forEach((b,i)=>b.classList.toggle('active',i===0?libraryFilter==='all':WORLDS[i-1]?.slug===libraryFilter));
}
function setLibFilter(slug){libraryFilter=slug;refreshLibrary();}
function setLibraryQuery(value){libraryQuery=value;refreshLibrary();}
function setLibrarySearch(value){libraryQuery=value;const el=document.getElementById('librarySearch');if(el)el.value=value;refreshLibrary();}
